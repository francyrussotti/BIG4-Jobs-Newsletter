name: 📰 Big4 Job Newsletter

on:
  schedule:
    # La pianificazione di GitHub NON è puntuale: nelle ore di punta parte con
    # ore di ritardo (a ottobre 2026 il cron delle 05:30 UTC partiva tra le 09:30
    # e le 13:30 UTC). Per questo ci sono più orari di riserva, anticipati e
    # non allo scoccare dell'ora (i minuti :00 e :30 sono i più congestionati):
    # la prima run che parte invia la newsletter, le successive vedono
    # "ultimo_invio" = oggi in seen_jobs.json e si fermano subito.
    # Orari in UTC (GitHub non gestisce l'ora legale):
    #   03:07 UTC = 04:07 ora solare / 05:07 ora legale
    #   04:07 UTC = 05:07 ora solare / 06:07 ora legale
    #   05:07 UTC = 06:07 ora solare / 07:07 ora legale
    - cron: "7 3 * * *"
    - cron: "7 4 * * *"
    - cron: "7 5 * * *"
  # Avvio manuale da GitHub, oppure da un servizio esterno all'orario esatto
  # (POST /repos/<owner>/<repo>/actions/workflows/newsletter.yml/dispatches).
  workflow_dispatch:
    inputs:
      forza:
        description: "Invia anche se la newsletter di oggi è già partita"
        type: boolean
        default: false

permissions:
  contents: write

# Mai due run in parallelo (es. avvio manuale mentre gira quella pianificata):
# manderebbero due email e andrebbero in conflitto sul push di seen_jobs.json.
concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    # Se un sito resta appeso, la run si ferma (il default di GitHub è 6 ore).
    # Una run normale dura pochi minuti.
    timeout-minutes: 50
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Ultima versione del branch al momento dell'avvio (non quella di quando
          # la run è stata messa in coda): così una run rimasta in attesa dietro
          # un'altra vede il seen_jobs.json appena aggiornato e non reinvia.
          ref: ${{ github.ref }}
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright + Chromium
        # Gira SEMPRE: requirements.txt dice "playwright>=…", quindi pip può
        # installare una versione nuova mentre la cache contiene il browser della
        # vecchia ("Executable doesn't exist", ottobre 2026). Se il browser giusto
        # è già in cache il comando non scarica nulla.
        run: playwright install chromium
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: sudo $(which playwright) install-deps chromium
      - name: Debug files before run
        run: ls -la
      - name: Run newsletter script
        # Limite più basso di quello del job: resta tempo per il commit dello storico
        timeout-minutes: 40
        env:
          GMAIL_MITTENTE: ${{ secrets.GMAIL_MITTENTE }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          NEWSLETTER_FORZA: ${{ inputs.forza }}
        run: python job_newsletter.py
      - name: Debug files after run
        run: ls -la
      - name: Commit seen_jobs.json
        if: always()   # deve girare anche se lo script esce con codice 1 (health check fallito),
                       # altrimenti si perderebbero gli ID già visti e lo storico dei conteggi
        run: |
          set -e
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add seen_jobs.json
          if git diff --staged --quiet; then
            echo "Nessuna modifica a seen_jobs.json"
            exit 0
          fi
          git commit -m "update seen jobs"
          # Se nel frattempo il branch è cambiato, riallinea invece di fallire
          for tentativo in 1 2 3; do
            if git push; then
              echo "Push riuscito al tentativo $tentativo"
              exit 0
            fi
            echo "Push fallito (tentativo $tentativo) — riallineo con il remoto..."
            git pull --rebase --autostash
          done
          echo "❌ Push di seen_jobs.json fallito dopo 3 tentativi"
          exit 1
