name: 📰 Big4 Job Newsletter

on:
  schedule:
    # GitHub Actions usa sempre UTC e non applica l'ora legale.
    # 05:30 UTC = 07:30 CEST (ora legale, in vigore da fine marzo a fine ottobre).
    # In ora solare (CET) scatterà alle 06:30 locali: limite noto del cron GitHub, che non gestisce il DST.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Mai due run in parallelo (es. avvio manuale mentre gira quella pianificata):
# manderebbero due email e andrebbero in conflitto sul push di seen_jobs.json.
concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    # Se un sito resta appeso, la run si ferma (il default di GitHub è 6 ore).
    # Una run normale dura pochi minuti.
    timeout-minutes: 50
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright + Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install chromium
          sudo $(which playwright) install-deps chromium
      - name: Debug files before run
        run: ls -la
      - name: Run newsletter script
        # Limite più basso di quello del job: resta tempo per il commit dello storico
        timeout-minutes: 40
        env:
          GMAIL_MITTENTE: ${{ secrets.GMAIL_MITTENTE }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        run: python job_newsletter.py
      - name: Debug files after run
        run: ls -la
      - name: Commit seen_jobs.json
        if: always()   # deve girare anche se lo script esce con codice 1 (health check fallito),
                       # altrimenti si perderebbero gli ID già visti e lo storico dei conteggi
        run: |
          set -e
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add seen_jobs.json
          if git diff --staged --quiet; then
            echo "Nessuna modifica a seen_jobs.json"
            exit 0
          fi
          git commit -m "update seen jobs"
          # Se nel frattempo il branch è cambiato, riallinea invece di fallire
          for tentativo in 1 2 3; do
            if git push; then
              echo "Push riuscito al tentativo $tentativo"
              exit 0
            fi
            echo "Push fallito (tentativo $tentativo) — riallineo con il remoto..."
            git pull --rebase --autostash
          done
          echo "❌ Push di seen_jobs.json fallito dopo 3 tentativi"
          exit 1
