name: 📰 Big4 Job Newsletter

on:
schedule:
- cron: "30 5 * * *"   # ogni giorno alle 07:30 ora italiana
workflow_dispatch:

permissions:
contents: write

jobs:
newsletter:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repo
    uses: actions/checkout@v4
    with:
      persist-credentials: true

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Cache pip
    uses: actions/cache@v4
    with:
      path: ~/.cache/pip
      key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

  - name: Install Python dependencies
    run: pip install -r requirements.txt

  - name: Install Playwright + Chromium
    run: |
      playwright install chromium
      sudo $(which playwright) install-deps chromium

  - name: Debug files before run
    run: ls -la

  - name: Run newsletter script
    env:
      GMAIL_MITTENTE: ${{ secrets.GMAIL_MITTENTE }}
      GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
    run: python job_newsletter.py

  - name: Debug files after run
    run: ls -la

  - name: Commit seen_jobs.json
    run: |
      git config --global user.name "github-actions"
      git config --global user.email "actions@github.com"
      git add seen_jobs.json
      git commit -m "update seen jobs" || echo "no changes"
      git push
```
