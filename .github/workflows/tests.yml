name: 🧪 Test

# Test offline (nessuna rete, nessuna email): girano a ogni modifica del codice,
# così un errore emerge prima della run delle 07:30.
on:
  push:
    paths: ["**.py", "requirements.txt", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 lxml
      - run: python -m unittest -v test_job_newsletter
