name: 🔎 Verifica completezza fonti

# Confronta ogni scraper con ricerche più ampie sullo stesso sito.
# Non invia la newsletter e non modifica seen_jobs.json.
# Gira ogni giorno su tutte le fonti: se trova un problema serio la run
# fallisce e GitHub manda un'email "Run failed"; il dettaglio è nella
# scheda Summary della run. Si può lanciare anche a mano.
on:
  schedule:
    # 14:17 UTC = 15:17 ora solare / 16:17 ora legale: dopo la newsletter
    # (che parte in mattinata), così non si sovrappone e non provoca 429.
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      fonti:
        description: "Fonti da verificare, separate da virgola (vuoto = tutte)"
        default: ""
  push:
    paths: ["verifica_siti.py", ".github/workflows/verifica.yml"]

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - name: Install Playwright + Chromium
        # Gira SEMPRE: requirements.txt dice "playwright>=…", quindi pip può
        # installare una versione nuova mentre la cache contiene il browser della
        # vecchia ("Executable doesn't exist", ottobre 2026). Se il browser giusto
        # è già in cache il comando non scarica nulla.
        run: playwright install chromium
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: sudo $(which playwright) install-deps chromium
      - run: python -u verifica_siti.py
        env:
          VERIFICA_FONTI: ${{ github.event_name == 'push' && 'EY,Deloitte,Accenture' || inputs.fonti }}
