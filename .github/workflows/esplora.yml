name: Esplora (temporaneo)
on:
  push:
    branches: [fix/copertura-ntt-lussemburgo]
    paths: ["esplora/**", ".github/workflows/esplora.yml"]
permissions:
  contents: read
jobs:
  esplora:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 lxml
      - run: python -u esplora/copertura.py
