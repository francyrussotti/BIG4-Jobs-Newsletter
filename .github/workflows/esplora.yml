name: Esplora (temporaneo)
on:
  push:
    branches: [claude/youthful-gates-ci1mkg]
    paths: ["esplora/**", ".github/workflows/esplora.yml"]
permissions:
  contents: read
jobs:
  esplora:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -u esplora/ntt_be.py
      - run: python -u esplora/paesi.py
        if: always()
