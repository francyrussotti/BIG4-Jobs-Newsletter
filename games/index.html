<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Playroom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  /* Layout: centered title + grid of colorful cards (3 → 2 → 1 columns). */
  .hero { text-align: center; padding-block: 56px 32px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .hero h1 {
    font-family: var(--font-display); font-weight: 700; margin: 0;
    font-size: clamp(44px, 10vw, 84px); letter-spacing: -0.02em; line-height: 1;
  }
  .hero h1 span { display: inline-block; }
  .hero h1 span:nth-child(odd) { color: var(--accent); }
  .hero p { margin: 0; color: var(--muted); font-size: 18px; max-width: 46ch; text-wrap: balance; }

  .grid {
    list-style: none; margin: 0 auto; padding: 0; max-width: 1040px;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px;
  }
  @media (max-width: 860px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 540px) { .grid { grid-template-columns: minmax(0, 1fr); } }

  .card a {
    display: flex; flex-direction: column; height: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
    color: inherit; text-decoration: none;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .card:nth-child(odd) a:hover { transform: translateY(-5px) rotate(-0.8deg); }
  .card:nth-child(even) a:hover { transform: translateY(-5px) rotate(0.8deg); }
  .card a:hover { box-shadow: 0 14px 30px var(--shadow); }
  .card a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  .thumb { display: block; width: 100%; height: auto; aspect-ratio: 5 / 3; max-width: 100%; }
  .meta { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .meta h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin: 0; }
  .meta p { margin: 0; color: var(--muted); font-size: 15px; }
  .tag {
    align-self: flex-start; margin-top: 6px; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
  }

  footer { text-align: center; color: var(--muted); font-size: 14px; padding-block: 48px 32px; }
  @media (prefers-reduced-motion: reduce) {
    .card a { transition: none; }
    .card a:hover, .card:nth-child(odd) a:hover, .card:nth-child(even) a:hover { transform: none; }
  }
</style>
</head>
<body>
<header class="hero">
  <h1><span>The</span> <span>Play</span><span>room</span></h1>
  <p>Little browser games and toys. No accounts, no downloads: just click and play.</p>
</header>

<main>
  <ul class="grid" id="grid" aria-label="Games"></ul>
</main>

<footer>Handmade with HTML, CSS and JavaScript. No libraries.</footer>

<script>
'use strict';
/* Game list: to add a game, add one object here
   (page file, title, description, tag and an SVG cover drawing). */
const GAMES = [
  {
    href: 'piazza-panic.html', title: 'Piazza Panic', tag: 'Arcade · keyboard',
    text: 'Police or protester in a made-up town square. Only objects get broken.',
    art: `<rect width="200" height="120" fill="#9a9384"/>
      <g stroke="#a8a192" stroke-width="3" fill="none"><ellipse cx="100" cy="60" rx="70" ry="42"/><ellipse cx="100" cy="60" rx="42" ry="26"/></g>
      <circle cx="100" cy="60" r="14" fill="#4f9bc4" stroke="#bdb6a6" stroke-width="4"/>
      <rect x="0" y="0" width="200" height="14" fill="#5d4a40"/><rect x="0" y="106" width="200" height="14" fill="#6b5a4c"/>
      <g fill="#e07a5f"><circle cx="58" cy="40" r="5"/><circle cx="140" cy="78" r="5"/></g>
      <g fill="#81b29a"><circle cx="70" cy="82" r="5"/><circle cx="128" cy="36" r="5"/></g>
      <g fill="#f2cc8f"><circle cx="150" cy="52" r="5"/><circle cx="46" cy="64" r="5"/></g>
      <g fill="#2d5bb0" stroke="#dfe6f2" stroke-width="2"><circle cx="20" cy="50" r="5"/><circle cx="20" cy="64" r="5"/><circle cx="32" cy="57" r="5"/></g>
      <circle cx="140" cy="78" r="9" fill="none" stroke="#e4572e" stroke-width="2"/>`,
  },
  {
    href: 'reflexes.html', title: 'Reflexes', tag: 'Challenge · 30 seconds',
    text: 'Click the moment it turns green. How many milliseconds do you need?',
    art: `<rect width="200" height="120" fill="#2fbf71"/>
      <path d="M110 14 L72 66 H98 L88 106 L130 50 H104 Z" fill="#fff"/>
      <text x="170" y="104" font-family="Fredoka, sans-serif" font-size="18" font-weight="700" fill="#0f5132" text-anchor="end">ms</text>`,
  },
  {
    href: 'ten-seconds.html', title: 'Ten Seconds', tag: 'Challenge · timing',
    text: 'Stop the clock at exactly 10.00 seconds. The digits vanish after 3 seconds.',
    art: `<rect width="200" height="120" fill="#ffcf3f"/>
      <circle cx="100" cy="64" r="40" fill="#fff" stroke="#1c1e2b" stroke-width="6"/>
      <rect x="92" y="12" width="16" height="10" rx="3" fill="#1c1e2b"/>
      <text x="100" y="73" font-family="Fredoka, sans-serif" font-size="24" font-weight="700" fill="#1c1e2b" text-anchor="middle">10.00</text>`,
  },
  {
    href: 'tower.html', title: 'Tower', tag: 'Arcade · one button',
    text: 'Stack the blocks on top of each other. Whatever hangs over falls off.',
    art: `<rect width="200" height="120" fill="#7cc6fe"/>
      <rect x="50" y="98" width="100" height="14" fill="#5b6ee1"/>
      <rect x="56" y="84" width="88" height="14" fill="#7b5be1"/>
      <rect x="62" y="70" width="80" height="14" fill="#b05be1"/>
      <rect x="62" y="56" width="70" height="14" fill="#e15bb5"/>
      <rect x="70" y="42" width="62" height="14" fill="#e15b6e"/>
      <rect x="118" y="20" width="62" height="14" fill="#e18a5b"/>`,
  },
  {
    href: 'sequence.html', title: 'Sequence', tag: 'Memory · sound',
    text: 'Watch, listen, repeat. The sequence grows every round.',
    art: `<rect width="200" height="120" fill="#24263a"/>
      <g transform="translate(100 60)">
        <path d="M-4 -4 V-46 A42 42 0 0 0 -46 -4 Z" fill="#2fbf71"/>
        <path d="M4 -4 H46 A42 42 0 0 0 4 -46 Z" fill="#e5484d"/>
        <path d="M-4 4 H-46 A42 42 0 0 0 -4 46 Z" fill="#ffcf3f"/>
        <path d="M4 4 V46 A42 42 0 0 0 46 4 Z" fill="#3b82f6"/>
      </g>`,
  },
  {
    href: 'dont-press.html', title: 'Don’t Press', tag: 'Toy · 2 minutes',
    text: 'There is a button. Don’t press it. Really.',
    art: `<rect width="200" height="120" fill="#ffb3c1"/>
      <ellipse cx="100" cy="80" rx="52" ry="18" fill="#7a1f2b"/>
      <ellipse cx="100" cy="66" rx="44" ry="24" fill="#e5484d"/>
      <ellipse cx="88" cy="58" rx="14" ry="6" fill="#ff8a8f"/>`,
  },
];

document.getElementById('grid').innerHTML = GAMES.map(g => `
  <li class="card">
    <a href="${g.href}">
      <svg class="thumb" viewBox="0 0 200 120" role="img" aria-label="Cover for ${g.title}">${g.art}</svg>
      <div class="meta">
        <h2>${g.title}</h2>
        <p>${g.text}</p>
        <span class="tag">${g.tag}</span>
      </div>
    </a>
  </li>`).join('');
</script>
</body>
</html>
