<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Non Premere</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  :root { --red: #e5484d; --red-dark: #8f1f27; --sad: #4b7bd8; --sad-dark: #23407a; --off: #9aa0b4; --off-dark: #5d6275; }
  .msg {
    font-family: var(--font-display); font-weight: 600; margin: 0; min-height: 2.6em;
    font-size: clamp(22px, 5vw, 32px); line-height: 1.3; max-width: 26ch; text-wrap: balance;
  }
  .arena { position: relative; width: 100%; height: min(52vh, 380px); transition: transform 0.6s ease; }
  .arena.flipped { transform: rotate(180deg); }
  .big-btn {
    --c: var(--red); --d: var(--red-dark);
    position: absolute; left: 50%; top: 50%; width: 170px; height: 170px; border-radius: 50%;
    transform: translate(-50%, -50%) scale(var(--s, 1));
    border: 0; cursor: pointer; background: var(--c); color: #fff;
    box-shadow: 0 14px 0 var(--d), 0 22px 30px var(--shadow);
    font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.04em;
    transition: left 0.35s ease, top 0.35s ease, transform 0.35s ease, opacity 0.6s, background-color 0.3s, box-shadow 0.08s;
    touch-action: manipulation;
  }
  .big-btn:active { box-shadow: 0 4px 0 var(--d), 0 8px 14px var(--shadow); transform: translate(-50%, calc(-50% + 10px)) scale(var(--s, 1)); }
  .big-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; }
  .big-btn.sad { --c: var(--sad); --d: var(--sad-dark); }
  .big-btn.off { --c: var(--off); --d: var(--off-dark); }
  .big-btn.shake { animation: shake 0.5s; }
  @keyframes shake {
    20% { margin-left: -10px; } 40% { margin-left: 10px; } 60% { margin-left: -8px; } 80% { margin-left: 8px; }
  }
  .count { color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }
  .restart { color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; font: inherit; }
  @media (prefers-reduced-motion: reduce) {
    .big-btn, .arena { transition: none; }
    .big-btn.shake { animation: none; }
  }
</style>
</head>
<body>
<header class="topbar"><a class="back" href="index.html">← La Ludoteca</a><span class="best"></span></header>
<main class="stage">
  <h1 class="game-title">Non Premere</h1>
  <p class="msg" id="msg" aria-live="polite">Non premere il bottone.</p>
  <div class="arena" id="arena">
    <button class="big-btn" id="btn">NON<br>PREMERE</button>
  </div>
  <p class="count" id="count">Premuto 0 volte</p>
  <button class="restart" id="restart" hidden>Ricomincia da capo</button>
</main>
<script>
'use strict';
const msg = document.getElementById('msg'), btn = document.getElementById('btn'), arena = document.getElementById('arena');
const countEl = document.getElementById('count'), restartBtn = document.getElementById('restart');

/* Il "copione": ogni pressione mostra il messaggio successivo e, se c'è, applica un effetto.
   Per allungare il gioco basta aggiungere righe qui. */
const STEPS = [
  ['Ehi. C’era scritto di non premerlo.'],
  ['Va bene, una volta può capitare.'],
  ['Due volte non capita per sbaglio.'],
  ['Ok, ti sposto il bottone.', 'move'],
  ['Insisti, eh?', 'move'],
  ['Lo rimpicciolisco. Così impari.', 'small'],
  ['Ancora più piccolo.', 'tiny'],
  ['Va bene, torna normale. Facciamo pace?', 'reset'],
  ['Non era un sì.'],
  ['Adesso il bottone è triste.', 'sad'],
  ['Contento? Ora è ancora più triste.', 'sad'],
  ['Basta, lo nascondo.', 'hide'],
  ['L’hai trovato lo stesso. Impressionante.', 'reset'],
  ['Caricamento della punizione…', 'load'],
  ['La punizione è: nessuna. Ti ho fatto paura?'],
  ['Giro la pagina. Letteralmente.', 'flip'],
  ['Raddrizzo tutto. Mi stai stancando.', 'unflip'],
  ['Facciamo un patto: altre 5 volte e smetto di parlare.'],
  ['4…'], ['3…'], ['2…'], ['1…'], ['…'],
  ['Ok, ho mentito. Non so stare zitto.'],
  ['Lo sai che non succede niente, vero?'],
  ['Il bottone ha chiamato il suo avvocato.', 'shake'],
  ['L’avvocato dice che puoi continuare. Che delusione.'],
  ['Ultimo avviso.', 'shake'],
  ['Hai finito il bottone. Non c’è altro. Davvero.', 'end'],
];
const AFTER_END = ['Davvero, è finito.', 'Sul serio.', 'Non c’è un finale segreto.', 'Forse.', 'No, non c’è.', 'Vai a giocare a qualcos’altro.'];
let step = 0, presses = 0, busy = false;

const FX = {
  move() { btn.style.left = `${15 + Math.random() * 70}%`; btn.style.top = `${22 + Math.random() * 56}%`; },
  small() { btn.style.setProperty('--s', '0.6'); },
  tiny() { btn.style.setProperty('--s', '0.3'); },
  reset() { btn.className = 'big-btn'; btn.style.cssText = ''; btn.innerHTML = 'NON<br>PREMERE'; },
  sad() { btn.classList.add('sad'); btn.textContent = ':('; },
  hide() { btn.style.opacity = '0.07'; },
  flip() { arena.classList.add('flipped'); },
  unflip() { arena.classList.remove('flipped'); },
  shake() { btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake'); },
  end() { FX.reset(); btn.classList.add('off'); btn.textContent = 'FINE'; restartBtn.hidden = false; },
  load() {                                                 // finto caricamento: il bottone si blocca per 3 secondi
    busy = true; btn.disabled = true; let k = 0;
    const id = setInterval(() => {
      k++; msg.textContent = `Caricamento della punizione${'.'.repeat(k % 4)} ${Math.min(100, k * 17)}%`;
      if (k >= 6) { clearInterval(id); busy = false; btn.disabled = false; msg.textContent = 'Punizione pronta. Premi per riceverla.'; }
    }, 500);
  },
};

btn.addEventListener('click', () => {
  if (busy) return;
  presses++;
  countEl.textContent = `Premuto ${presses} ${presses === 1 ? 'volta' : 'volte'}`;
  if (step < STEPS.length) {
    const [text, fx] = STEPS[step++];
    msg.textContent = text;
    if (fx) FX[fx]();
  } else {
    msg.textContent = AFTER_END[(presses - STEPS.length - 1) % AFTER_END.length];
  }
});
restartBtn.addEventListener('click', () => {
  step = 0; presses = 0; FX.reset(); FX.unflip(); restartBtn.hidden = true;
  msg.textContent = 'Non premere il bottone.'; countEl.textContent = 'Premuto 0 volte';
});
</script>
</body>
</html>
