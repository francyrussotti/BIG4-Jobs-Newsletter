<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Don’t Press</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  :root { --red: #e5484d; --red-dark: #8f1f27; --sad: #4b7bd8; --sad-dark: #23407a; --off: #9aa0b4; --off-dark: #5d6275; }
  .msg {
    font-family: var(--font-display); font-weight: 600; margin: 0; min-height: 2.6em;
    font-size: clamp(22px, 5vw, 32px); line-height: 1.3; max-width: 26ch; text-wrap: balance;
  }
  .arena { position: relative; width: 100%; height: min(52vh, 380px); transition: transform 0.6s ease; }
  .arena.flipped { transform: rotate(180deg); }
  .big-btn {
    --c: var(--red); --d: var(--red-dark);
    position: absolute; left: 50%; top: 50%; width: 170px; height: 170px; border-radius: 50%;
    transform: translate(-50%, -50%) scale(var(--s, 1));
    border: 0; cursor: pointer; background: var(--c); color: #fff;
    box-shadow: 0 14px 0 var(--d), 0 22px 30px var(--shadow);
    font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.04em;
    transition: left 0.35s ease, top 0.35s ease, transform 0.35s ease, opacity 0.6s, background-color 0.3s, box-shadow 0.08s;
    touch-action: manipulation;
  }
  .big-btn:active { box-shadow: 0 4px 0 var(--d), 0 8px 14px var(--shadow); transform: translate(-50%, calc(-50% + 10px)) scale(var(--s, 1)); }
  .big-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; }
  .big-btn.sad { --c: var(--sad); --d: var(--sad-dark); }
  .big-btn.off { --c: var(--off); --d: var(--off-dark); }
  .big-btn.shake { animation: shake 0.5s; }
  @keyframes shake {
    20% { margin-left: -10px; } 40% { margin-left: 10px; } 60% { margin-left: -8px; } 80% { margin-left: 8px; }
  }
  .count { color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }
  .restart { color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; font: inherit; }
  @media (prefers-reduced-motion: reduce) {
    .big-btn, .arena { transition: none; }
    .big-btn.shake { animation: none; }
  }
</style>
</head>
<body>
<header class="topbar"><a class="back" href="index.html">← The Playroom</a><span class="best"></span></header>
<main class="stage">
  <h1 class="game-title">Don’t Press</h1>
  <p class="msg" id="msg" aria-live="polite">Don’t press the button.</p>
  <div class="arena" id="arena">
    <button class="big-btn" id="btn">DON’T<br>PRESS</button>
  </div>
  <p class="count" id="count">Pressed 0 times</p>
  <button class="restart" id="restart" hidden>Start over</button>
</main>
<script>
'use strict';
const msg = document.getElementById('msg'), btn = document.getElementById('btn'), arena = document.getElementById('arena');
const countEl = document.getElementById('count'), restartBtn = document.getElementById('restart');

/* The "script": each press shows the next message and, if there is one, applies an effect.
   To make the game longer, just add lines here. */
const STEPS = [
  ['Hey. It said not to press it.'],
  ['Fine, once can happen.'],
  ['Twice is not an accident.'],
  ['Okay, I’m moving the button.', 'move'],
  ['Persistent, huh?', 'move'],
  ['I’m shrinking it. That’ll teach you.', 'small'],
  ['Even smaller.', 'tiny'],
  ['Fine, back to normal. Truce?', 'reset'],
  ['That wasn’t a yes.'],
  ['Now the button is sad.', 'sad'],
  ['Happy? Now it’s even sadder.', 'sad'],
  ['That’s it, I’m hiding it.', 'hide'],
  ['You found it anyway. Impressive.', 'reset'],
  ['Loading your punishment…', 'load'],
  ['Your punishment is: nothing. Scared you?'],
  ['I’m turning the page. Literally.', 'flip'],
  ['Turning it back. You’re wearing me out.', 'unflip'],
  ['Deal: 5 more presses and I’ll stop talking.'],
  ['4…'], ['3…'], ['2…'], ['1…'], ['…'],
  ['Okay, I lied. I can’t stay quiet.'],
  ['You know nothing happens, right?'],
  ['The button has called its lawyer.', 'shake'],
  ['The lawyer says you can keep going. How disappointing.'],
  ['Final warning.', 'shake'],
  ['You’ve finished the button. There’s nothing else. Really.', 'end'],
];
const AFTER_END = ['Really, it’s over.', 'Seriously.', 'There’s no secret ending.', 'Maybe.', 'No, there isn’t.', 'Go play something else.'];
let step = 0, presses = 0, busy = false;

const FX = {
  move() { btn.style.left = `${15 + Math.random() * 70}%`; btn.style.top = `${22 + Math.random() * 56}%`; },
  small() { btn.style.setProperty('--s', '0.6'); },
  tiny() { btn.style.setProperty('--s', '0.3'); },
  reset() { btn.className = 'big-btn'; btn.style.cssText = ''; btn.innerHTML = 'DON’T<br>PRESS'; },
  sad() { btn.classList.add('sad'); btn.textContent = ':('; },
  hide() { btn.style.opacity = '0.07'; },
  flip() { arena.classList.add('flipped'); },
  unflip() { arena.classList.remove('flipped'); },
  shake() { btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake'); },
  end() { FX.reset(); btn.classList.add('off'); btn.textContent = 'THE END'; restartBtn.hidden = false; },
  load() {                                                 // fake loading: the button locks for 3 seconds
    busy = true; btn.disabled = true; let k = 0;
    const id = setInterval(() => {
      k++; msg.textContent = `Loading your punishment${'.'.repeat(k % 4)} ${Math.min(100, k * 17)}%`;
      if (k >= 6) { clearInterval(id); busy = false; btn.disabled = false; msg.textContent = 'Punishment ready. Press to receive it.'; }
    }, 500);
  },
};

btn.addEventListener('click', () => {
  if (busy) return;
  presses++;
  countEl.textContent = `Pressed ${presses} ${presses === 1 ? 'time' : 'times'}`;
  if (step < STEPS.length) {
    const [text, fx] = STEPS[step++];
    msg.textContent = text;
    if (fx) FX[fx]();
  } else {
    msg.textContent = AFTER_END[(presses - STEPS.length - 1) % AFTER_END.length];
  }
});
restartBtn.addEventListener('click', () => {
  step = 0; presses = 0; FX.reset(); FX.unflip(); restartBtn.hidden = true;
  msg.textContent = 'Don’t press the button.'; countEl.textContent = 'Pressed 0 times';
});
</script>
</body>
</html>
