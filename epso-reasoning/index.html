<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPSO Reasoning Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: exam console. Top bar with section clock; stimulus pane left, question pane right; stacks on narrow screens. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --fg:#172030; --muted:#5a6578; --line:#d3dae4;
  --accent:#20438f; --accent-fg:#ffffff; --accent-soft:#e2e8f6;
  --ok:#16774a; --ok-soft:#dff2e8; --bad:#b3262c; --bad-soft:#fbe4e4; --warn:#9a6100; --warn-soft:#fbefd6;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --panel:#171e29; --fg:#e3e8f0; --muted:#97a2b5; --line:#2a3443;
  --accent:#8fb0ff; --accent-fg:#0f141c; --accent-soft:#1e2a43;
  --ok:#5fd19a; --ok-soft:#173326; --bad:#ff8a8f; --bad-soft:#3a1c1f; --warn:#f2c060; --warn-soft:#3a2d12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c; --panel:#171e29; --fg:#e3e8f0; --muted:#97a2b5; --line:#2a3443;
  --accent:#8fb0ff; --accent-fg:#0f141c; --accent-soft:#1e2a43;
  --ok:#5fd19a; --ok-soft:#173326; --bad:#ff8a8f; --bad-soft:#3a1c1f; --warn:#f2c060; --warn-soft:#3a2d12; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
[hidden]{display:none!important}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
h1{font-size:1.45rem;letter-spacing:-.01em} h2{font-size:1.08rem} h3{font-size:.95rem}
p{margin:0} a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem} .big2{font-size:1.35rem}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.narrow{max-width:760px}
.stack{display:flex;flex-direction:column;gap:14px} .stack>*,.grid2>*,.split>*,.cards3>*,.hero>*{min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center} .spread{justify-content:space-between} .wrap-gap{gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px}
button,select,input{font:inherit;color:var(--fg)}
button{cursor:pointer;border-radius:5px;border:1px solid var(--line);background:var(--panel);padding:9px 14px;min-height:40px}
button:hover:not([disabled]){border-color:var(--accent)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent} button.small{min-height:32px;padding:4px 10px}
button[disabled]{opacity:.45;cursor:default}
select,input[type=number],input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 10px;min-height:40px;width:100%}
label{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--muted)}
.alert{background:var(--warn-soft);color:var(--fg);border-radius:5px;padding:10px 14px}

header.top{background:var(--panel);border-bottom:1px solid var(--line)}
header.top .in{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}

.hero{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left}
.primary-card{border-color:var(--accent);border-width:2px}
.primary-card b{font-size:1.1rem}
.spec{color:var(--accent);font-size:.86rem}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.cards3,.grid2{grid-template-columns:1fr}}
.plan{margin:0;padding-left:1.2rem;display:grid;gap:6px}
.tips{margin:0;padding-left:1.2rem;display:grid;gap:6px}

.verdicts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.vd{border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:4px;background:var(--panel)}
.vd.ok{border-left:4px solid var(--ok)} .vd.bad{border-left:4px solid var(--bad)}
.verdicts.big .vd b{font-size:1.8rem}
.pill{display:inline-block;justify-self:start;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .in{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.secname{font-weight:600}
.clock{font-size:1.35rem;font-weight:500;padding:2px 10px;border-radius:4px}
.clock.low{background:var(--bad-soft);color:var(--bad)}
.qgrid{display:flex;flex-wrap:wrap;gap:5px}
.cell{min-width:34px;min-height:34px;padding:0;font-family:var(--f-mono);font-size:.82rem;position:relative}
.cell.ans{background:var(--accent-soft);border-color:var(--accent-soft)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cell.r-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent} .cell.r-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:16px}
.split.abstract{grid-template-columns:1fr}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.passage{font-family:var(--f-read);font-size:1.05rem;line-height:1.7;max-width:70ch;margin-top:8px}
.small2{font-size:.95rem}
.src{font-size:.78rem;color:var(--muted);margin-top:8px}
.qpanel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.split.abstract .qpanel{position:static}
@media (max-width:900px){.qpanel{position:static}}
.qtext{font-weight:600;font-size:1.02rem}
.opts{display:grid;gap:8px}
.opt{text-align:left;display:flex;gap:12px;align-items:flex-start;padding:11px 13px;line-height:1.45}
.opt .ltr{font-family:var(--f-mono);font-size:.8rem;min-width:1.6rem;height:1.6rem;display:grid;place-items:center;border:1px solid var(--line);border-radius:3px;flex:none}
.opt .otext{font-family:var(--f-read);font-size:1rem}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)} .opt.sel .ltr{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opts.figs{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:620px){.opts.figs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.figopt{flex-direction:column;align-items:center;padding:8px}
.fig{width:100%;max-width:120px;height:auto;display:block}
.series{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:10px;max-width:780px}
.series.sm{max-width:520px;gap:6px}
@media (max-width:620px){.series{grid-template-columns:repeat(3,minmax(0,1fr))}}
.qmark{border:2px dashed var(--line);border-radius:4px;display:grid;place-items:center;font-size:2rem;color:var(--muted);aspect-ratio:1;max-width:120px}
.optmini{display:grid;gap:2px;justify-items:center;border-radius:4px;padding:2px}
.optmini.k{outline:2px solid var(--ok)} .optmini.w{outline:2px solid var(--bad)}
.fb{border-radius:5px;padding:12px 14px;font-size:.92rem;display:grid;gap:6px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.kind{font-size:.74rem;font-weight:600;padding:1px 7px;border-radius:3px}
.k-true{background:var(--ok-soft);color:var(--ok)} .k-false{background:var(--bad-soft);color:var(--bad)} .k-cannot{background:var(--warn-soft);color:var(--warn)}

.tblwrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse}
table.data{font-variant-numeric:tabular-nums;min-width:320px}
table.data caption{text-align:left;font-weight:600;padding-bottom:8px}
table.data th,table.data td{border:1px solid var(--line);padding:7px 12px;text-align:right}
table.data th[scope=row],table.data thead th:first-child{text-align:left}
table.data thead th{background:var(--accent-soft);font-weight:600}
.lead{margin-bottom:10px}
.chart figcaption{font-weight:600;margin-bottom:6px}
.chart svg{width:100%;max-width:560px;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:12px;font-family:var(--f-ui)}
.chart .val{fill:var(--fg);font-size:12px;font-family:var(--f-mono)}
.chart .bar{fill:var(--accent)}
.chart .pl{fill:#fff;font-size:13px;font-weight:600;font-family:var(--f-mono)}
.p1{fill:#20438f}.p2{fill:#3f7d6e}.p3{fill:#b0602c}.p4{fill:#7a4d9a}.p5{fill:#5b6b7f}.p6{fill:#a33a4c}
.calc{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:260px;z-index:8;box-shadow:0 8px 28px rgba(0,0,0,.18);display:grid;gap:8px}
.cdisp{background:var(--bg);border-radius:4px;padding:8px 10px;text-align:right}
.cexpr{font-size:.85rem;color:var(--muted);min-height:1.2em;word-break:break-all} .cout{font-size:1.3rem}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px} .ckeys button{padding:6px;min-height:38px;font-family:var(--f-mono)}
.ckeys button:last-child{grid-column:span 1}
ul.bars{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.bars li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:5px}
table.times{width:100%;font-size:.88rem}
table.times th,table.times td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
td.tb{width:40%} td.tb i{display:block;height:7px;border-radius:4px;background:var(--accent)} td.tb i.over{background:var(--warn)}
.okc{color:var(--ok)} .badc{color:var(--bad)}
details summary{cursor:pointer;color:var(--accent)}
.review{display:grid;gap:12px;margin-top:12px}
.ritem{border-left:3px solid var(--line);padding:4px 0 4px 14px;display:grid;gap:6px}
.ritem.ok{border-color:var(--ok)} .ritem.bad{border-color:var(--bad)}
textarea{width:100%;min-height:120px;font-family:var(--f-mono);font-size:.76rem;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:8px}
.filebtn{flex-direction:row;align-items:center;border:1px solid var(--line);border-radius:5px;padding:9px 14px;color:var(--fg);cursor:pointer;min-height:40px}
.filebtn input{display:none}
table.sheet td,table.sheet th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
.seg{display:flex;gap:4px} .seg button{min-width:36px;min-height:34px;padding:0;font-family:var(--f-mono)}
.seg button.sel{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)} .seg button.selk{background:var(--ok);color:#fff;border-color:var(--ok)}
.foot{margin-top:28px;font-size:.8rem;color:var(--muted);display:grid;gap:6px;max-width:90ch}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.show{opacity:1}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.chk{flex-direction:row;align-items:flex-start;gap:10px;color:var(--fg);font-size:.95rem}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
tr.today td{background:var(--accent-soft)}
.causes{gap:6px} .causes button.csel{background:var(--warn-soft);border-color:var(--warn);color:var(--fg);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="2.4"/></pattern></defs></svg>
<div id="app"></div>
<script>
// Original verbal reasoning items written for this trainer. Passages and statements are original text.
// Format per item: q = 'c' (which statement is correct) or 'i' (which is incorrect).
// o = options; the FIRST option is the key. Each option: [kind, trap, statement, explanation(it)].
// kind: 'true' | 'false' | 'cannot'. trap codes: see TRAPS in app.js.
const VERBAL_ORIGINAL = [
{id:'o01',topic:'Urban climate',q:'c',text:"Cities are often several degrees warmer than the surrounding countryside, a phenomenon known as the urban heat island effect. Dark surfaces such as asphalt and roofing tar absorb solar radiation during the day and release it slowly at night, which keeps night-time temperatures high. A three-year study in four mid-sized European cities found that districts where at least a quarter of roof area had been converted into vegetated 'green roofs' recorded average summer night temperatures 0.8°C lower than comparable districts without them. The researchers cautioned that the effect depended heavily on irrigation: in the driest of the four cities, unwatered green roofs dried out by mid-July and their cooling effect largely disappeared. They also noted that green roofs are more expensive to install than reflective white coatings, which lower daytime roof temperatures but have little influence on air temperature at street level.",
o:[['true','',"In at least one of the cities studied, the cooling provided by green roofs was reduced when they were not watered.","Il testo dice che nella città più secca i tetti verdi non irrigati si seccavano e l'effetto spariva in gran parte."],
['false','con',"Reflective white coatings were found to lower night-time air temperatures more effectively than green roofs.","Il testo dice il contrario: i rivestimenti bianchi hanno poca influenza sulla temperatura dell'aria a livello della strada."],
['cannot','ass',"Green roofs reduce night temperatures mainly because plants absorb less solar radiation than asphalt.","Il meccanismo per cui i tetti verdi raffreddano non è spiegato: è un'assunzione."],
['false','gen',"Converting a quarter of roof area into green roofs lowers summer night temperatures by 0.8°C in every European city.","0,8°C è una media di quattro città, e in una l'effetto spariva senza irrigazione: la generalizzazione è smentita."]]},

{id:'o02',topic:'History of printing',q:'c',text:"Before the arrival of the printing press in Europe in the mid-fifteenth century, books were copied by hand, mostly in monasteries and, from the thirteenth century onwards, increasingly in workshops attached to universities. A single copy of a long text could take a scribe many months. Printing did not immediately make handwritten books disappear: wealthy collectors continued to commission illuminated manuscripts for several decades, partly because they regarded printed volumes as inferior objects. Within fifty years of the first printed books, however, an estimated several million copies had been produced, and the price of an ordinary book had fallen sharply. Historians disagree about how quickly literacy rose as a result; some argue that cheaper books mainly benefited people who could already read, while others point to the rapid growth of printed pamphlets aimed at a wider public.",
o:[['true','',"Some buyers continued to prefer handwritten books after printed books became available.","I collezionisti ricchi continuarono a commissionare manoscritti per decenni, considerando i libri stampati inferiori."],
['false','con',"Printing caused handwritten book production to stop within a few years.","Il testo parla di 'several decades' di manoscritti dopo l'arrivo della stampa."],
['cannot','cau',"The spread of printing was the main reason literacy increased in Europe.","Gli storici non sono d'accordo sull'effetto della stampa sull'alfabetizzazione: il testo non stabilisce la causa principale."],
['cannot','qnt',"Before the thirteenth century, no books were copied outside monasteries.","'Mostly in monasteries' non significa 'only': il testo non dice se esistessero altri luoghi prima del XIII secolo."]]},

{id:'o03',topic:'Public procurement',q:'c',text:"Public authorities across the European Union spend a significant share of their budgets on buying goods, works and services from private companies. To make these purchases more transparent, procurement procedures above certain financial thresholds must be advertised so that companies from any Member State can submit a bid. A recent review of national practices found that the share of procedures receiving only a single bid had increased over the previous decade in a majority of the countries examined. The authors of the review identified several possible explanations, including short deadlines, complex documentation and the tendency of some authorities to define technical requirements in ways that favour a known supplier. They stressed, however, that a single bid does not in itself prove that a procedure was unfair, since in some specialised markets only one qualified supplier may exist.",
o:[['true','',"A procedure that attracts only one bid may still have been conducted fairly.","Gli autori dicono che un'offerta unica non prova di per sé che la procedura sia stata scorretta."],
['false','con',"Over the previous decade, single-bid procedures became less common in most of the countries examined.","Il testo dice che la quota di procedure con offerta unica è aumentata nella maggioranza dei paesi."],
['cannot','cau',"Short deadlines were the main cause of the increase in single-bid procedures.","Le scadenze brevi sono una delle possibili spiegazioni, senza alcuna gerarchia tra le cause."],
['cannot','gen',"All purchases by public authorities must be advertised across the EU.","Il testo parla solo delle procedure sopra certe soglie; sugli acquisti sotto soglia non dice nulla."]]},

{id:'o04',topic:'Pollinators',q:'c',text:"Wild bees pollinate a large share of flowering crops, yet their populations have declined in many parts of Europe. In a field experiment, researchers placed colonies of bumblebees next to oilseed rape fields treated with one of two common insecticides and next to untreated fields. Colonies near treated fields produced on average 40 percent fewer new queens by the end of the season, although the number of worker bees was similar across all sites. Because new queens are the only members of a colony that survive the winter and found new colonies the following spring, the researchers argued that the impact on future populations could be greater than counts of workers alone would suggest. The study did not examine honeybees, which are managed by beekeepers and may respond differently.",
o:[['true','',"Measuring only the number of worker bees could underestimate the effect of the insecticides on future bumblebee populations.","Le operaie erano simili ovunque, mentre le nuove regine (le sole che fondano colonie) erano il 40% in meno."],
['false','mix',"Bumblebee colonies near treated fields had about 40 percent fewer workers than those near untreated fields.","Il 40% riguarda le nuove regine; il numero di operaie era simile in tutti i siti."],
['cannot','ext',"Honeybees are less affected by these insecticides than bumblebees.","Le api da miele non sono state studiate: il testo dice solo che 'may respond differently'."],
['cannot','cau',"The decline of wild bees in Europe is mainly caused by insecticides used on oilseed rape.","Il testo non individua la causa principale del declino delle api selvatiche."]]},

{id:'o05',topic:'Remote work',q:'c',text:"When large numbers of office employees began working from home, many managers feared that productivity would fall. Data collected by a consultancy from several hundred firms in three countries suggest a more mixed picture. Employees who worked remotely two or three days a week reported slightly higher output than before, measured by the number of tasks completed, while those working remotely every day reported no significant change. At the same time, newly hired staff who worked fully remotely were promoted less often during their first two years than colleagues hired at the same time who spent more days in the office. The consultancy cautioned that its data were based partly on self-reported output and that firms which chose to offer hybrid arrangements may differ in other ways from those that did not.",
o:[['true','',"Part of the evidence used in the study depended on employees' own assessments of their work.","I dati si basano 'partly on self-reported output'."],
['false','con',"Employees who worked remotely every day reported a significant fall in output.","Chi lavorava sempre da remoto non ha riportato cambiamenti significativi."],
['cannot','cau',"Fully remote new hires were promoted less often because their managers saw less of their work.","Il testo riporta il fatto (meno promozioni), non la causa."],
['cannot','gen',"The study found that hybrid working increases productivity in all firms.","I dati sono parziali e auto-dichiarati, e le aziende ibride potrebbero differire in altro: 'in all firms' non è supportato."]]},

{id:'o06',topic:'Bilingual children',q:'i',text:"Children who grow up speaking two languages sometimes start producing their first words slightly later than children exposed to only one language. This delay, when it occurs, is usually small and temporary. Studies that count the total number of words a bilingual child knows across both languages generally find that it is similar to, or higher than, the vocabulary of monolingual children of the same age, even though the vocabulary in each separate language may be smaller. Researchers have also reported that bilingual children tend to perform better on certain tasks that require switching attention between rules, although recent large studies have found this advantage to be weaker than earlier, smaller studies suggested.",
o:[['false','',"Bilingual children always begin speaking later than monolingual children.","Domanda sull'affermazione ERRATA: il testo dice 'sometimes', non 'always'."],
['true','',"When vocabulary in both languages is counted together, bilingual children often know as many words as monolingual children.","Vera: il vocabolario totale è 'similar to, or higher than' quello dei monolingui."],
['cannot','ext',"Bilingual children perform better at school overall than monolingual children.","Non deducibile, ma non è smentita dal testo, quindi non è la risposta a una domanda sull'affermazione errata."],
['true','',"Larger studies have found a smaller attention-switching advantage than earlier research.","Vera: i grandi studi recenti hanno trovato un vantaggio più debole."]]},

{id:'o07',topic:'Shipping',q:'c',text:"Maritime transport carries most of the world's traded goods by volume and is relatively efficient per tonne transported. Its total greenhouse gas emissions are nevertheless substantial because of the enormous quantities involved. One widely discussed way to cut fuel use is 'slow steaming', in which ships sail below their design speed. Because the fuel a ship burns rises much faster than its speed, a modest reduction in speed can produce a disproportionately large saving in fuel per voyage. Slow steaming has drawbacks: voyages take longer, so more ships may be needed to carry the same volume of goods within the same period, and customers with time-sensitive cargo may object. Several shipping lines adopted the practice during periods of low freight rates, when there were more ships available than cargo to fill them.",
o:[['true','',"Reducing a ship's speed by a small amount can lower its fuel use per voyage by a larger proportion.","Il testo: una riduzione modesta della velocità produce un risparmio 'disproportionately large'."],
['false','con',"Slow steaming reduces the number of ships needed to transport a given volume of goods.","Il contrario: potrebbero servire più navi."],
['cannot','cau',"Shipping lines adopted slow steaming during periods of low freight rates mainly to reduce emissions.","Il testo dà solo una coincidenza temporale (noli bassi, navi in eccesso), non il motivo."],
['cannot','ext',"Maritime transport emits more greenhouse gases than air transport.","Il trasporto aereo non è menzionato: serve conoscenza esterna."]]},

{id:'o08',topic:'Museums',q:'c',text:"In the year after a regional government abolished entrance fees at its public museums, visitor numbers rose by more than half. A later evaluation, however, found that the social profile of visitors had changed little: the share of visitors with a university degree remained well above their share of the regional population. Most of the additional visits were made by people who had already visited museums before the change and now came more often. The evaluation's authors concluded that removing fees was effective at increasing attendance but, on its own, was not sufficient to attract groups who rarely visit museums. They recommended combining free entry with outreach programmes run with schools and community organisations, although they did not estimate the cost of such programmes.",
o:[['true','',"After fees were abolished, many of the extra visits came from people who were already museum visitors.","'Most of the additional visits were made by people who had already visited museums'."],
['false','con',"Abolishing entrance fees significantly increased the share of visitors without a university degree.","Il profilo sociale 'had changed little'."],
['cannot','ext',"Outreach programmes with schools would cost less than the revenue lost from entrance fees.","I costi dei programmi non sono stati stimati."],
['cannot','qnt',"Visitor numbers rose only because entrance fees were abolished.","Il testo non esclude altri fattori: 'only' va oltre ciò che è affermato."]]},

{id:'o09',topic:'Antibiotics',q:'c',text:"Antibiotics are used not only to treat people but also in livestock farming. In some countries they have been given to healthy animals in low doses to promote faster growth, a practice now banned in the European Union. Bacteria exposed repeatedly to antibiotics can develop resistance, and resistant strains can pass from animals to humans through direct contact, through the environment or through food. Measuring how much of the resistance found in human infections originates in farming is difficult, because the same resistance genes can arise independently in hospitals. A review of surveillance data concluded that reducing antibiotic use in animals is associated with lower resistance in animals and, to a lesser and less certain extent, in humans.",
o:[['true','',"The evidence linking lower antibiotic use in animals to lower resistance is stronger for animals than for humans.","Per gli umani l'associazione è 'to a lesser and less certain extent'."],
['false','mod',"Giving antibiotics to healthy animals to promote growth is still permitted in the European Union.","La pratica 'is now banned in the European Union'."],
['cannot','qnt',"Most resistant infections in humans originate in livestock farming.","Il testo dice che è difficile misurare quanta resistenza venga dagli allevamenti."],
['false','qnt',"Resistance genes always arise first in animals and later in hospitals.","Gli stessi geni 'can arise independently in hospitals': 'always first in animals' è smentito."]]},

{id:'o10',topic:'Sleep and memory',q:'c',text:"Sleep appears to play an important role in consolidating memories. In a laboratory study, volunteers learned a list of word pairs in the evening and were tested the next morning; one group slept normally while the other was kept awake all night. The group that had slept recalled around a fifth more word pairs. A second experiment found that a short afternoon nap of about an hour produced a smaller but still measurable improvement compared with staying awake. The researchers noted that the benefit was largest for word pairs that volunteers had found difficult to learn, and smallest for those they had already mastered before the break.",
o:[['true','',"In the study, sleep seemed to help most with the material that had been hardest to learn.","Il beneficio era massimo per le coppie difficili da imparare."],
['false','con',"An afternoon nap improved recall as much as a full night's sleep.","Il pisolino dava un miglioramento 'smaller'."],
['cannot','gen',"Students who sleep more than eight hours obtain better exam results.","Esami e ore di sonno non sono trattati: generalizzazione."],
['cannot','mix',"Volunteers kept awake all night forgot about a fifth of the word pairs they had learned.","'Un quinto' è la differenza tra i due gruppi, non la quota dimenticata da chi era rimasto sveglio."]]},

{id:'o11',topic:'Urban mobility',q:'c',text:"Shared electric scooters appeared in many European cities within a short period, often before local rules had been adapted to them. Some cities responded by limiting the number of operators through tenders, others by setting maximum speeds or banning scooters from pavements. One capital city held a referendum in which a large majority of those who voted supported a ban on rental scooters, although turnout was below ten percent. Operators argue that scooters replace car journeys; independent surveys in several cities, however, found that most scooter trips replaced walking or public transport rather than car use. Supporters of scooters reply that they may still be useful for the first or last part of longer journeys made by train or metro.",
o:[['true','',"According to independent surveys, most scooter trips in several cities did not replace car journeys.","La maggior parte dei viaggi sostituiva camminate o trasporto pubblico."],
['false','qnt',"Most residents of the capital city voted in favour of banning rental scooters.","Ha votato meno del 10%: la maggioranza dei votanti non è la maggioranza dei residenti."],
['cannot','cau',"Cities that banned scooters from pavements saw fewer accidents.","Gli incidenti non sono menzionati."],
['cannot','mod',"Electric scooters are mainly used for the first or last part of train journeys.","I sostenitori dicono solo che 'may still be useful' per quel tratto: non è un dato d'uso."]]},

{id:'o12',topic:'Food waste',q:'c',text:"A significant share of food produced for human consumption is never eaten. In richer countries, most of this waste occurs at the end of the supply chain, in shops and especially in households, whereas in poorer countries more food is lost after harvest because of inadequate storage and transport. Date labels are one factor behind household waste: many consumers do not distinguish between a 'use by' date, which concerns safety, and a 'best before' date, which concerns quality. Surveys in one Member State found that clearer labelling, combined with an information campaign, coincided with a reduction in household food waste of around ten percent over five years, though the authors noted that rising food prices over the same period may also have played a role.",
o:[['true','',"The fall in household food waste reported in the surveys may not have been due only to clearer labelling.","Gli autori citano anche la campagna informativa e l'aumento dei prezzi."],
['false','mix',"In richer countries, most food waste occurs after harvest because of poor storage.","Lo spreco post-raccolto riguarda i paesi più poveri; in quelli ricchi avviene in negozi e famiglie."],
['cannot','ext',"Food past its 'best before' date is safe to eat.","Il testo dice che il 'best before' riguarda la qualità, ma non afferma che il cibo scaduto sia sicuro."],
['cannot','cmp',"Consumers in poorer countries waste more food at home than consumers in richer countries.","Il testo non confronta lo spreco domestico tra paesi."]]},

{id:'o13',topic:'Wind energy',q:'c',text:"Wind turbines are sometimes criticised for killing birds. Estimates of the number of birds killed per turbine vary widely, mainly because carcasses are often removed by scavengers before surveys find them. Studies agree, however, that the location of a turbine matters far more than its number of blades or the colour of its tower: turbines placed on migration routes or near the nesting sites of large birds of prey cause disproportionately many deaths. In a recent trial at one wind farm, painting one of the three blades black reduced bird deaths by around 70 percent compared with neighbouring unpainted turbines. The researchers stressed that the trial involved only a small number of turbines and needed to be repeated at other sites before firm conclusions could be drawn.",
o:[['true','',"The researchers considered the results of the blade-painting trial to be preliminary.","Hanno detto che va ripetuto in altri siti prima di conclusioni definitive."],
['false','mix',"Studies agree that the colour of a turbine's tower is the most important factor in bird deaths.","Gli studi concordano che conta molto di più la posizione; il colore della torre conta meno."],
['cannot','gen',"Painting one blade black would reduce bird deaths by about 70 percent at all wind farms.","Una sola prova su poche turbine: l'estensione a tutti gli impianti non è supportata."],
['cannot','ext',"Wind turbines kill fewer birds than buildings and traffic.","Edifici e traffico non sono menzionati."]]},

{id:'o14',topic:'Commodity prices',q:'c',text:"The price of coffee beans on international markets can change sharply from one year to the next. Coffee trees take several years to reach full production, so farmers cannot quickly expand supply when prices are high, and they are reluctant to remove trees when prices are low. Weather is another source of volatility: a frost or drought in a major producing region can reduce global supply substantially. Higher prices on commodity markets are not always passed on in full to consumers, because the cost of raw beans accounts for only part of the retail price of a cup of coffee in a café, alongside rent, wages and other costs.",
o:[['true','',"A rise in the price of coffee beans may increase the retail price of café coffee by a smaller percentage.","Le materie prime sono solo una parte del prezzo al dettaglio: lo stesso aumento pesa meno in percentuale."],
['false','con',"Coffee farmers can increase production within a single season when prices rise.","Le piante impiegano anni a entrare in piena produzione."],
['cannot','qnt',"Frost is the most common cause of coffee price increases.","Il gelo è una delle cause di volatilità; non si dice che sia la più frequente."],
['cannot','qnt',"Café owners usually absorb the full increase in bean prices.","'Not always passed on in full' non significa che i bar assorbano di solito tutto l'aumento."]]},

{id:'o15',topic:'Canals',q:'c',text:"During the late eighteenth century, a wave of canal construction transformed inland transport in parts of north-western Europe. A horse pulling a barge on a canal could move a load many times heavier than it could pull in a cart on the rough roads of the period. Canal companies raised capital by selling shares, and several early canals paid generous dividends, encouraging further investment. Not all projects succeeded: some canals built during a speculative boom in the 1790s never carried enough traffic to repay their costs. From the 1830s, railways began to compete for freight, and although many canals continued to operate for decades, their share of goods traffic declined steadily.",
o:[['true','',"Not every canal built in the 1790s proved profitable.","Alcuni canali degli anni Novanta del Settecento non hanno mai ripagato i costi."],
['false','con',"Canals stopped operating soon after railways appeared.","Molti canali continuarono a operare per decenni."],
['cannot','ext',"Railways were cheaper to build than canals.","I costi di costruzione delle ferrovie non sono indicati."],
['cannot','cau',"The success of early canals was the main reason railways were invented.","Il testo non parla dell'origine delle ferrovie."]]},

{id:'o16',topic:'Microplastics',q:'c',text:"Microplastics, fragments smaller than five millimetres, have been found in oceans, rivers, soil and the air. Some are manufactured at that size, for example as beads in cosmetics, but most result from the breakdown of larger items such as bottles, packaging and synthetic textiles. Washing clothes made of synthetic fibres releases large numbers of tiny fibres, a share of which pass through wastewater treatment plants. The effects of microplastics on human health are not yet well understood. Laboratory studies have shown harmful effects in some animals at high concentrations, but researchers caution that these concentrations are often far above those measured in the environment.",
o:[['true','',"Not all microplastics are produced by the breakdown of larger plastic items.","Alcune sono prodotte già di quella dimensione, per esempio le microsfere dei cosmetici."],
['false','con',"Wastewater treatment plants remove all the fibres released by washing synthetic clothes.","Una parte delle fibre attraversa gli impianti di depurazione."],
['cannot','ext',"Microplastics in drinking water are harmful to human health.","Gli effetti sulla salute umana 'are not yet well understood'."],
['false','mix',"Most microplastics are manufactured as beads for cosmetics.","La maggior parte deriva dalla frammentazione di oggetti più grandi."]]},

{id:'o17',topic:'Working time',q:'c',text:"Several companies have experimented with a four-day working week in which employees work fewer hours for the same pay. In one trial involving around sixty firms, most participating companies decided to continue with the arrangement after six months. Employees reported lower levels of stress and fatigue, and the number of sick days fell. Company revenue over the trial period was broadly stable compared with the same period in previous years. Critics point out that the firms volunteered to take part and were therefore likely to be those most suited to shorter hours, and that the trial did not include manufacturing companies with continuous production lines.",
o:[['true','',"The firms in the trial may not be representative of all companies.","Le aziende si sono offerte volontarie e mancavano le manifatturiere a ciclo continuo."],
['false','con',"Most firms abandoned the four-day week once the trial ended.","La maggior parte ha deciso di continuare."],
['false','mix',"Revenue increased substantially in firms that adopted the four-day week.","Il fatturato è rimasto 'broadly stable'."],
['cannot','ass',"Manufacturing companies would be unable to adopt a four-day week.","Non erano incluse nella prova: questo non dice nulla sulla loro capacità di adottarla."]]},

{id:'o18',topic:'Volcanoes and climate',q:'c',text:"Large volcanic eruptions can cool the Earth's climate temporarily. When an eruption is powerful enough to inject sulphur gases into the stratosphere, these gases form tiny droplets that reflect part of the incoming sunlight. Because the stratosphere has no rain to wash them out, the droplets can remain there for one to two years. A major eruption in the early 1990s was followed by a drop in average global temperature of about half a degree Celsius over the following year. Eruptions that release ash and gas only into the lower atmosphere have much smaller climatic effects, because the particles are removed by precipitation within weeks.",
o:[['true','',"How long an eruption affects the climate depends partly on how high its gases reach in the atmosphere.","Stratosfera: da uno a due anni; bassa atmosfera: rimosse in poche settimane."],
['false','mix',"Sulphur droplets in the stratosphere are removed by rain within a few weeks.","Nella stratosfera non piove; la rimozione in settimane riguarda la bassa atmosfera."],
['cannot','ext',"The eruption in the early 1990s was the largest of the twentieth century.","Il confronto con altre eruzioni non è nel testo."],
['cannot','cau',"The temperature drop after the early-1990s eruption was caused entirely by sulphur droplets.","Il testo dice che il calo 'was followed by' l'eruzione: 'entirely' non è supportato."]]},

{id:'o19',topic:'Minimum wages',q:'c',text:"Most Member States of the European Union have a statutory minimum wage set by law, while in a few countries minimum pay is determined mainly through collective agreements between employers and trade unions. Where collective bargaining covers a large majority of workers, governments have argued that a statutory minimum is unnecessary. Economists disagree about the employment effects of raising minimum wages. Some studies find that moderate increases have little effect on the number of jobs, while others find that they reduce employment among young and low-skilled workers. Researchers broadly agree that the effects depend on the level of the minimum wage relative to typical wages in the country concerned.",
o:[['true','',"Not every EU Member State sets its minimum wage by law.","In alcuni paesi il minimo è fissato soprattutto con la contrattazione collettiva."],
['false','qnt',"Economists agree that raising the minimum wage always reduces employment.","Gli economisti non sono d'accordo, e alcuni studi trovano effetti minimi."],
['cannot','cmp',"Countries without a statutory minimum wage have lower unemployment.","La disoccupazione tra i due gruppi di paesi non è confrontata."],
['cannot','qnt',"Collective agreements cover a large majority of workers in every Member State.","Il testo parla di copertura ampia solo dove la contrattazione è diffusa."]]},

{id:'o20',topic:'Roman aqueducts',q:'c',text:"The aqueducts of ancient Rome carried water from springs and rivers, sometimes over distances of more than ninety kilometres. Contrary to a common image, most of their length ran underground or at ground level; the famous arches were used mainly where a channel had to cross a valley. The aqueducts relied entirely on gravity, so engineers had to maintain a gentle and continuous downward slope along the whole route. Water was distributed through a system that gave priority to public fountains and baths, with private households able to obtain a connection only by paying for it. Lead pipes were used in parts of the distribution network, but the high mineral content of the water often formed deposits inside the pipes.",
o:[['true','',"Arches made up a relatively small part of the total length of the aqueducts.","La maggior parte del percorso era sotterranea o a livello del suolo."],
['false','con',"Pumps were used to raise water over hills along the aqueduct routes.","Gli acquedotti 'relied entirely on gravity'."],
['cannot','ass',"Mineral deposits in the pipes protected Romans from lead poisoning.","Il testo menziona i depositi ma non i loro effetti sulla salute."],
['false','mix',"Private households were given priority over public baths in the distribution of water.","La priorità andava a fontane pubbliche e terme."]]},

{id:'o21',topic:'Online reviews',q:'c',text:"Online customer reviews strongly influence purchasing decisions, particularly for restaurants, hotels and consumer electronics. Studies of review platforms have found that a small increase in a business's average rating can lead to a noticeable rise in bookings or sales. This has created incentives to manipulate ratings, for example by paying for positive reviews or posting negative ones about competitors. Platforms use automated systems to detect suspicious patterns, such as many reviews posted from the same location within a short time. Consumer organisations, however, report that a significant number of fake reviews still escape detection.",
o:[['true','',"Some fake reviews are not identified by platforms' automated systems.","Le associazioni dei consumatori riportano che molte recensioni false sfuggono ai controlli."],
['false','con',"Changes in a business's average rating have no measurable effect on its sales.","Anche un piccolo aumento del voto medio porta a un aumento visibile."],
['cannot','qnt',"Most negative reviews on review platforms are posted by competitors.","Le recensioni negative dei concorrenti sono un esempio di manipolazione, non una quota."],
['cannot','mod',"Automated detection systems will soon eliminate fake reviews entirely.","Nulla sul futuro dei sistemi di rilevamento."]]},

{id:'o22',topic:'Alpine glaciers',q:'c',text:"Mountain glaciers in the Alps have lost a substantial part of their volume since the middle of the nineteenth century, and the rate of loss has accelerated in recent decades. Glaciers act as natural reservoirs: they store water as ice in winter and release meltwater during hot, dry summers, when rainfall is low and demand for water is high. In the short term, faster melting can actually increase summer river flows. Once a glacier has shrunk beyond a certain point, however, the amount of meltwater it can supply begins to decline. Hydrologists expect that many smaller Alpine glaciers have already passed this point, while the largest ones may continue to supply increasing summer flows for some decades.",
o:[['true','',"For some Alpine glaciers, the summer meltwater supply is expected to decline.","Molti ghiacciai piccoli hanno già superato la soglia oltre la quale l'acqua di fusione diminuisce."],
['false','qnt',"Faster melting always reduces summer river flows.","Nel breve periodo può aumentarli."],
['cannot','mod',"Alpine glaciers will disappear completely by the end of the century.","Nessuna previsione sulla scomparsa dei ghiacciai."],
['false','mix',"Glaciers release most of their meltwater in winter.","L'acqua di fusione viene rilasciata in estate."]]},

{id:'o23',topic:'Smartphones',q:'i',text:"In one experiment, university students completed tests of working memory while their smartphones were either on the desk, in a bag, or in another room. All phones were switched to silent so that no notifications could be heard or seen. Students whose phones were in another room performed significantly better than those whose phones were on the desk, with the 'in a bag' group falling in between. The researchers suggested that the mere presence of a phone may draw on limited attentional resources, as part of the mind is occupied in not checking it. Later attempts by other teams to replicate the experiment produced mixed results, with several finding smaller or no differences.",
o:[['false','',"Students in the experiment received visible notifications on their phones during the tests.","Domanda sull'affermazione ERRATA: i telefoni erano silenziati, nessuna notifica era visibile."],
['true','',"Students whose phones were in a bag performed better than those whose phones were on the desk.","Vera: il gruppo 'in a bag' si collocava tra gli altri due."],
['true','',"Not all later studies confirmed the original findings.","Vera: le repliche hanno dato risultati contrastanti."],
['cannot','gen',"Students who leave their phones in another room obtain higher exam grades.","Non deducibile ma non smentita: per una domanda 'incorrect' non è la risposta."]]},

{id:'o24',topic:'Monetary policy',q:'c',text:"Central banks in many advanced economies aim to keep inflation at around two percent over the medium term. When inflation rises well above that level, a central bank can raise its policy interest rate, making borrowing more expensive for banks, businesses and households. The effect on prices is not immediate: economists estimate that changes in interest rates take between one and two years to have their full impact on inflation. This delay means that central banks must base decisions on forecasts, which can be wrong, particularly when inflation is driven by sudden changes in energy or food prices that interest rates cannot directly influence.",
o:[['true','',"An interest rate decision taken today may not have its full effect on inflation until more than a year later.","L'effetto pieno arriva in uno-due anni."],
['false','con',"Raising interest rates lowers inflation immediately.","'The effect on prices is not immediate'."],
['cannot','mod',"Central banks' inflation forecasts are usually inaccurate.","'Can be wrong' non significa 'usually inaccurate'."],
['false','con',"Interest rates allow central banks to directly control energy and food prices.","I tassi 'cannot directly influence' quei prezzi."]]},

{id:'o25',topic:'Machine translation',q:'c',text:"Machine translation has improved considerably in recent years thanks to systems trained on very large collections of texts that already exist in two or more languages. The quality of the output varies with the language pair: translations between widely used languages with abundant training data are generally more accurate than those involving languages with fewer available texts. Professional translators increasingly use such systems to produce a first draft, which they then correct, a practice known as post-editing. Some translators report that post-editing is faster for routine documents but can be slower than translating from scratch for creative or highly technical texts, where errors may be subtle and difficult to spot.",
o:[['true','',"For certain kinds of text, correcting a machine translation can take longer than translating without it.","Per testi creativi o molto tecnici la post-editing 'can be slower'."],
['false','con',"Machine translation is equally accurate for all language pairs.","La qualità varia con la coppia di lingue."],
['cannot','mod',"Professional translators will no longer be needed in the future.","Nessuna previsione del genere nel testo."],
['cannot','qnt',"Most professional translators now use post-editing for all their work.","'Increasingly use' non dice 'most', né 'for all their work'."]]},

{id:'o26',topic:'Forest fires',q:'c',text:"The area burned by forest fires in southern Europe varies greatly from year to year, depending largely on summer weather. Long-term records show no simple upward trend in the total area burned in several Mediterranean countries, partly because firefighting capacity has improved. However, the number of very large fires, which are the hardest to control, has increased in some regions. Experts point to the abandonment of farmland in rural areas as one contributing factor: fields that are no longer cultivated or grazed become covered with shrubs and young trees that provide continuous fuel. Hotter and drier summers, which climate models project to become more frequent, are expected to increase fire risk further.",
o:[['true','',"In some regions very large fires have become more frequent even though the total burned area in several countries shows no simple upward trend.","Le due informazioni sono entrambe nel testo e compatibili."],
['false','con',"Records show that the total area burned in Mediterranean countries has risen steadily.","'No simple upward trend'."],
['cannot','cau',"Farmland abandonment is the main cause of very large fires.","È 'one contributing factor', non la causa principale."],
['false','con',"Grazing animals increase the amount of fuel available for fires.","I campi non più pascolati si coprono di arbusti: il pascolo riduce il combustibile."]]},

{id:'o27',topic:'Open data',q:'c',text:"Public bodies collect large amounts of data in the course of their work, from weather measurements to company registers and public transport timetables. Making such data available for reuse can allow businesses to develop new services, such as route-planning applications that combine timetables from several operators. To encourage this, EU rules require that certain high-value datasets held by public bodies be made available free of charge and in machine-readable formats. Some public bodies had previously earned revenue by selling access to their data and expressed concern about losing this income. Studies estimating the economic value of open data produce very different figures, depending on the methods and assumptions used.",
o:[['true','',"Estimates of the economic benefits of open data differ considerably.","Gli studi producono cifre 'very different'."],
['cannot','qnt',"All data held by public bodies must be provided free of charge under EU rules.","L'obbligo riguarda 'certain high-value datasets'; per gli altri il testo non dice nulla."],
['false','con',"No public body had charged for access to its data before these rules were introduced.","Alcuni enti guadagnavano vendendo l'accesso."],
['cannot','qnt',"Route-planning applications are the most profitable use of open data.","Sono solo un esempio."]]},

{id:'o28',topic:'History of medicine',q:'c',text:"The discovery that a mould could kill bacteria was made in a London laboratory in 1928, when a researcher noticed that bacteria failed to grow around a mould that had accidentally contaminated one of his culture plates. He published his observations, but producing the active substance in usable quantities proved extremely difficult, and for about a decade little progress was made. At the end of the 1930s, a team at another university developed methods to purify the substance and tested it successfully on infected mice and then on a small number of patients. Large-scale production began during the Second World War, largely in the United States, where companies developed techniques for growing the mould in large fermentation tanks.",
o:[['true','',"Several years passed between the original observation and the development of methods to purify the substance.","1928 → fine anni Trenta: circa un decennio."],
['false','con',"Large-scale production of the substance began shortly after the 1928 observation.","La produzione su larga scala iniziò durante la Seconda guerra mondiale."],
['cannot','ass',"The researcher who made the original observation led the team that purified the substance.","Il testo parla di 'a team at another university' senza nominarne i membri."],
['cannot','ext',"Most of the substance produced during the war was used by the armed forces.","L'uso della produzione bellica non è indicato."]]},

{id:'o29',topic:'Noise',q:'c',text:"Environmental noise, mainly from road traffic, is one of the most widespread environmental pressures in Europe's cities. Long-term exposure to high noise levels at night is associated with sleep disturbance and an increased risk of cardiovascular disease. Noise can be reduced at its source through quieter road surfaces, lower speed limits and quieter tyres. Noise barriers along roads are effective for nearby buildings but provide little benefit to upper floors of tall buildings or to areas further away. A city that introduced a 30 km/h speed limit on most residential streets reported a reduction in average noise levels of around two to three decibels, a change that residents typically perceive as noticeable but modest.",
o:[['true','',"Noise barriers are of limited use for the upper floors of tall buildings.","Le barriere danno 'little benefit to upper floors'."],
['false','con',"Residents generally perceived the noise reduction after the speed limit change as very large.","Percepita come 'noticeable but modest'."],
['cannot','cau',"Night-time noise exposure causes cardiovascular disease in most people exposed to it.","Il testo parla di associazione con un rischio maggiore, non di causa né di 'most people'."],
['cannot','cmp',"Quieter road surfaces are cheaper than noise barriers.","I costi non sono indicati."]]},

{id:'o30',topic:'Coral reefs',q:'c',text:"Coral reefs cover a tiny fraction of the ocean floor but host a large share of known marine species. Reef-building corals live in partnership with microscopic algae that supply them with energy through photosynthesis. When sea temperatures stay unusually high for several weeks, corals expel these algae and turn white, a process known as bleaching. Bleached corals are not dead and can recover if temperatures return to normal quickly enough, but prolonged or repeated bleaching often leads to widespread mortality. Scientists have observed that some coral colonies survive heatwaves that kill neighbouring colonies of the same species, and they are investigating whether this tolerance can be passed on to offspring.",
o:[['true','',"A coral that has bleached may still survive.","'Bleached corals are not dead and can recover'."],
['false','mix',"Bleaching occurs when algae expel corals during periods of unusually low temperature.","Sono i coralli a espellere le alghe, e con temperature alte."],
['cannot','mod',"Heat tolerance in corals is passed on to their offspring.","È ancora oggetto di studio."],
['cannot','qnt',"Coral reefs host most of the world's marine species.","'A large share of known' non è 'most of the world's'."]]}
];
