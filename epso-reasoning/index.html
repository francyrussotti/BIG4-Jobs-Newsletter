const VERBAL_KVIZ = [{"id": "k01", "src": "32024R1689-r44", "topic": "Regulation (EU) 2024/1689 (Artificial Intelligence Act)", "url": "https://eur-lex.europa.eu/eli/reg/2024/1689/oj", "recital": 44, "text": "There are serious concerns about the scientific basis of AI systems aiming to identify or infer emotions, particularly as expression of emotions vary considerably across cultures and situations, and even within a single individual. Among the key shortcomings of such systems are the limited reliability, the lack of specificity and the limited generalisability. Therefore, AI systems identifying or inferring emotions or intentions of natural persons on the basis of their biometric data may lead to discriminatory outcomes and can be intrusive to the rights and freedoms of the concerned persons. Considering the imbalance of power in the context of work or education, combined with the intrusive nature of these systems, such systems could lead to detrimental or unfavourable treatment of certain natural persons or whole groups thereof. Therefore, the placing on the market, the putting into service, or the use of AI systems intended to be used to detect the emotional state of individuals in situations related to the workplace and education should be prohibited. That prohibition should not cover AI systems placed on the market strictly for medical or safety reasons, such as systems intended for therapeutical use.", "st": [{"k": "true", "s": "One reason given for doubting these systems is that the same person may express emotions differently.", "w": "The passage says expression of emotions varies \"even within a single individual\"."}, {"k": "false", "s": "The passage proposes banning emotion recognition systems in all settings.", "w": "The ban covers the workplace and education only, and excludes systems for medical or safety reasons."}, {"k": "cannot", "s": "Emotion recognition systems are more accurate for some cultures than for others.", "w": "The passage says expression varies across cultures but says nothing about accuracy by culture."}, {"k": "false", "s": "A system marketed solely for therapeutic use in a school would fall under the prohibition.", "w": "The prohibition should not cover systems placed on the market strictly for medical reasons, \"such as systems intended for therapeutical use\"."}, {"k": "true", "s": "The passage links the risk of unfavourable treatment at work and in education partly to the imbalance of power between the parties.", "w": "\"Considering the imbalance of power in the context of work or education…\" such systems could lead to unfavourable treatment."}]}, {"id": "k02", "src": "32024R1689-r31", "topic": "Regulation (EU) 2024/1689 (Artificial Intelligence Act)", "url": "https://eur-lex.europa.eu/eli/reg/2024/1689/oj", "recital": 31, "text": "AI systems providing social scoring of natural persons by public or private actors may lead to discriminatory outcomes and the exclusion of certain groups. They may violate the right to dignity and non-discrimination and the values of equality and justice. Such AI systems evaluate or classify natural persons or groups thereof on the basis of multiple data points related to their social behaviour in multiple contexts or known, inferred or predicted personal or personality characteristics over certain periods of time. The social score obtained from such AI systems may lead to the detrimental or unfavourable treatment of natural persons or whole groups thereof in social contexts, which are unrelated to the context in which the data was originally generated or collected or to a detrimental treatment that is disproportionate or unjustified to the gravity of their social behaviour. AI systems entailing such unacceptable scoring practices and leading to such detrimental or unfavourable outcomes should therefore be prohibited. That prohibition should not affect lawful evaluation practices of natural persons that are carried out for a specific purpose in accordance with Union and national law.", "st": [{"k": "false", "s": "The concern about social scoring applies only to systems operated by public authorities.", "w": "The passage covers scoring \"by public or private actors\"."}, {"k": "true", "s": "Treatment out of proportion to the gravity of a person's social behaviour is one of the outcomes the passage objects to.", "w": "The passage names treatment \"disproportionate or unjustified to the gravity of their social behaviour\"."}, {"k": "cannot", "s": "Social scoring systems are already in use in at least one Member State.", "w": "The passage says nothing about current use in any Member State."}, {"k": "false", "s": "The prohibition would also rule out lawful evaluations of people carried out for a specific purpose under national law.", "w": "\"That prohibition should not affect lawful evaluation practices of natural persons that are carried out for a specific purpose…\""}, {"k": "true", "s": "According to the passage, harm can arise when a score is used in a context unrelated to the one in which the data were collected.", "w": "The passage names unfavourable treatment \"in social contexts, which are unrelated to the context in which the data was originally generated or collected\"."}]}, {"id": "k03", "src": "32024R1689-r63", "topic": "Regulation (EU) 2024/1689 (Artificial Intelligence Act)", "url": "https://eur-lex.europa.eu/eli/reg/2024/1689/oj", "recital": 63, "text": "The fact that an AI system is classified as a high-risk AI system under this Regulation should not be interpreted as indicating that the use of the system is lawful under other acts of Union law or under national law compatible with Union law, such as on the protection of personal data, on the use of polygraphs and similar tools or other systems to detect the emotional state of natural persons. Any such use should continue to occur solely in accordance with the applicable requirements resulting from the Charter and from the applicable acts of secondary Union law and national law. This Regulation should not be understood as providing for the legal ground for processing of personal data, including special categories of personal data, where relevant, unless it is specifically otherwise provided for in this Regulation.", "st": [{"k": "false", "s": "Classifying a system as high-risk confirms that its use is lawful under data protection law.", "w": "Classification \"should not be interpreted as indicating that the use of the system is lawful\" under other law, such as data protection."}, {"k": "true", "s": "The Regulation is not meant to serve as a legal ground for processing personal data, unless it specifically provides otherwise.", "w": "This is the last sentence of the passage."}, {"k": "cannot", "s": "The use of polygraphs is banned under national law in most Member States.", "w": "Polygraphs are named only as an example of an area of law; the passage says nothing about bans."}, {"k": "true", "s": "Such use of AI systems should continue to comply with the requirements resulting from the Charter.", "w": "\"Any such use should continue to occur solely in accordance with the applicable requirements resulting from the Charter…\""}, {"k": "cannot", "s": "Most high-risk AI systems process special categories of personal data.", "w": "The passage mentions special categories but not how many systems process them."}]}, {"id": "k04", "src": "32024R1689-r102", "topic": "Regulation (EU) 2024/1689 (Artificial Intelligence Act)", "url": "https://eur-lex.europa.eu/eli/reg/2024/1689/oj", "recital": 102, "text": "Software and data, including models, released under a free and open-source licence that allows them to be openly shared and where users can freely access, use, modify and redistribute them or modified versions thereof, can contribute to research and innovation in the market and can provide significant growth opportunities for the Union economy. General-purpose AI models released under free and open-source licences should be considered to ensure high levels of transparency and openness if their parameters, including the weights, the information on the model architecture, and the information on model usage are made publicly available. The licence should be considered to be free and open-source also when it allows users to run, copy, distribute, study, change and improve software and data, including models under the condition that the original provider of the model is credited, the identical or comparable terms of distribution are respected.", "st": [{"k": "true", "s": "An open-source general-purpose AI model whose parameters including the weights, architecture information and usage information are public should be considered to ensure high levels of transparency.", "w": "The second sentence sets out exactly this condition."}, {"k": "false", "s": "A licence that requires users to credit the original provider cannot count as free and open-source.", "w": "A licence counts as free and open-source \"also when\" it requires crediting the original provider."}, {"k": "cannot", "s": "Most general-purpose AI models on the Union market are released under open-source licences.", "w": "The passage gives no figure or share for the market."}, {"k": "true", "s": "The passage counts the freedom to modify and redistribute software among the features of a free and open-source licence.", "w": "First sentence: users can freely \"access, use, modify and redistribute them\"."}, {"k": "cannot", "s": "Open-source models carry less risk of misuse than proprietary ones.", "w": "The passage does not discuss risk of misuse."}]}, {"id": "k05", "src": "32016R0679-r43", "topic": "Regulation (EU) 2016/679 (General Data Protection Regulation)", "url": "https://eur-lex.europa.eu/eli/reg/2016/679/oj", "recital": 43, "text": "In order to ensure that consent is freely given, consent should not provide a valid legal ground for the processing of personal data in a specific case where there is a clear imbalance between the data subject and the controller, in particular where the controller is a public authority and it is therefore unlikely that consent was freely given in all the circumstances of that specific situation. Consent is presumed not to be freely given if it does not allow separate consent to be given to different personal data processing operations despite it being appropriate in the individual case, or if the performance of a contract, including the provision of a service, is dependent on the consent despite such consent not being necessary for such performance.", "st": [{"k": "true", "s": "Consent is presumed not to be freely given if a service is made dependent on consent that the service does not need.", "w": "The second sentence names exactly this case."}, {"k": "cannot", "s": "Public authorities rely on consent less often than private companies do.", "w": "The passage says nothing about how often consent is used."}, {"k": "false", "s": "Bundling several processing operations under one consent is acceptable even where separate consent would be appropriate.", "w": "In that case consent is presumed not to be freely given."}, {"k": "true", "s": "The aim of the rules described is to ensure that consent is freely given.", "w": "The passage opens with \"In order to ensure that consent is freely given…\""}]}, {"id": "k06", "src": "32016R0679-r85", "topic": "Regulation (EU) 2016/679 (General Data Protection Regulation)", "url": "https://eur-lex.europa.eu/eli/reg/2016/679/oj", "recital": 85, "text": "A personal data breach may, if not addressed in an appropriate and timely manner, result in physical, material or non-material damage to natural persons such as loss of control over their personal data or limitation of their rights, discrimination, identity theft or fraud, financial loss, unauthorised reversal of pseudonymisation, damage to reputation, loss of confidentiality of personal data protected by professional secrecy or any other significant economic or social disadvantage to the natural person concerned. Therefore, as soon as the controller becomes aware that a personal data breach has occurred, the controller should notify the personal data breach to the supervisory authority without undue delay and, where feasible, not later than 72 hours after having become aware of it, unless the controller is able to demonstrate, in accordance with the accountability principle, that the personal data breach is unlikely to result in a risk to the rights and freedoms of natural persons. Where such notification cannot be achieved within 72 hours, the reasons for the delay should accompany the notification and information may be provided in phases without undue further delay.", "st": [{"k": "false", "s": "The controller must always notify the supervisory authority within 72 hours.", "w": "The deadline applies \"where feasible\", late notice is allowed with reasons, and no notice is needed if a risk is unlikely."}, {"k": "true", "s": "If notification takes longer than 72 hours, the controller should give the reasons for the delay.", "w": "Last sentence: \"the reasons for the delay should accompany the notification\"."}, {"k": "true", "s": "Notification is not needed if the controller can demonstrate that the breach is unlikely to result in a risk to the rights and freedoms of natural persons.", "w": "The passage gives this exception with \"unless\"."}, {"k": "cannot", "s": "Identity theft is the most common harm caused by personal data breaches.", "w": "Identity theft is one listed harm; the passage says nothing about frequency."}, {"k": "false", "s": "All information about the breach has to be supplied in a single notification.", "w": "\"information may be provided in phases\"."}]}, {"id": "k07", "src": "32016R0679-r151", "topic": "Regulation (EU) 2016/679 (General Data Protection Regulation)", "url": "https://eur-lex.europa.eu/eli/reg/2016/679/oj", "recital": 151, "text": "The legal systems of Denmark and Estonia do not allow for administrative fines as set out in this Regulation. The rules on administrative fines may be applied in such a manner that in Denmark the fine is imposed by competent national courts as a criminal penalty and in Estonia the fine is imposed by the supervisory authority in the framework of a misdemeanour procedure, provided that such an application of the rules in those Member States has an equivalent effect to administrative fines imposed by supervisory authorities. Therefore the competent national courts should take into account the recommendation by the supervisory authority initiating the fine. In any event, the fines imposed should be effective, proportionate and dissuasive.", "st": [{"k": "true", "s": "In Denmark, a fine under the Regulation may be imposed by a court as a criminal penalty.", "w": "\"in Denmark the fine is imposed by competent national courts as a criminal penalty\"."}, {"k": "false", "s": "In Estonia, fines are imposed by the national courts in criminal proceedings.", "w": "In Estonia the supervisory authority imposes the fine in a misdemeanour procedure."}, {"k": "cannot", "s": "Danish courts usually impose lower fines than supervisory authorities in other Member States.", "w": "The passage says nothing about the size of fines."}, {"k": "true", "s": "The special arrangements for Denmark and Estonia are allowed only if they have an effect equivalent to administrative fines imposed by supervisory authorities.", "w": "The passage sets this condition: \"provided that such an application… has an equivalent effect\"."}, {"k": "cannot", "s": "Estonia's legal system allows criminal penalties for data protection infringements.", "w": "For Estonia the passage describes only a misdemeanour procedure; it does not say whether criminal penalties exist."}]}, {"id": "k08", "src": "32023R2854-r88", "topic": "Regulation (EU) 2023/2854 (Data Act)", "url": "https://eur-lex.europa.eu/eli/reg/2023/2854/oj", "recital": 88, "text": "Switching charges are charges imposed by providers of data processing services on the customers for the switching process. Typically, those charges are intended to pass on costs which the source provider of data processing services may incur because of the switching process to the customer who wishes to switch. Common examples of switching charges are costs related to the transit of data from one provider of data processing services to another or to an on-premises ICT infrastructure (data egress charges) or the costs incurred for specific support actions during the switching process. Unnecessarily high data egress charges and other unjustified charges unrelated to actual switching costs inhibit customers from switching, restrict the free flow of data, have the potential to limit competition and cause lock-in effects for the customers by reducing incentives to choose a different or additional service provider. Switching charges should therefore be abolished after three years from the date of entry into force of this Regulation. Providers of data processing services should be able to impose reduced switching charges up to that date.", "st": [{"k": "true", "s": "Data egress charges are one example of switching charges.", "w": "The passage gives them among the \"common examples of switching charges\"."}, {"k": "false", "s": "Until switching charges are abolished, providers may keep imposing them at their full level.", "w": "Up to that date they should be able to impose only \"reduced\" switching charges."}, {"k": "cannot", "s": "Switching charges are currently the main reason customers stay with their cloud provider.", "w": "The passage says charges inhibit switching, not that they are the main reason customers stay."}, {"k": "false", "s": "According to the passage, switching charges are typically meant to earn the source provider extra profit.", "w": "They are typically intended to pass on the source provider's costs to the customer."}, {"k": "true", "s": "The passage argues that unjustified charges can reduce customers' incentive to choose an additional service provider.", "w": "\"reducing incentives to choose a different or additional service provider\"."}]}, {"id": "k09", "src": "32023R2854-r19", "topic": "Regulation (EU) 2023/2854 (Data Act)", "url": "https://eur-lex.europa.eu/eli/reg/2023/2854/oj", "recital": 19, "text": "Data literacy refers to the skills, knowledge and understanding that allows users, consumers and businesses, in particular SMEs falling within the scope of this Regulation, to gain awareness of the potential value of the data they generate, produce and share and that they are motivated to offer and provide access to in accordance with relevant legal rules. Data literacy should go beyond learning about tools and technologies and aim to equip and empower citizens and businesses with the ability to benefit from an inclusive and fair data market. The spread of data literacy measures and the introduction of appropriate follow-up actions could contribute to improving working conditions and ultimately sustain the consolidation, and innovation path of, the data economy in the Union. Competent authorities should promote tools and adopt measures to advance data literacy among users and entities falling within the scope of this Regulation and an awareness of their rights and obligations thereunder.", "st": [{"k": "true", "s": "According to the passage, data literacy should involve more than learning about tools and technologies.", "w": "\"should go beyond learning about tools and technologies\"."}, {"k": "cannot", "s": "Most SMEs in the Union currently lack data literacy.", "w": "The passage says nothing about current levels of data literacy."}, {"k": "true", "s": "Competent authorities are expected to promote data literacy.", "w": "\"Competent authorities should promote tools and adopt measures to advance data literacy…\""}, {"k": "false", "s": "The passage claims that data literacy measures will certainly improve working conditions.", "w": "The passage says only that they \"could contribute\"."}, {"k": "cannot", "s": "Data literacy training should be compulsory for consumers.", "w": "The passage says nothing about compulsory training."}]}, {"id": "k10", "src": "32022R2065-r69", "topic": "Regulation (EU) 2022/2065 (Digital Services Act)", "url": "https://eur-lex.europa.eu/eli/reg/2022/2065/oj", "recital": 69, "text": "When recipients of the service are presented with advertisements based on targeting techniques optimised to match their interests and potentially appeal to their vulnerabilities, this can have particularly serious negative effects. In certain cases, manipulative techniques can negatively impact entire groups and amplify societal harms, for example by contributing to disinformation campaigns or by discriminating against certain groups. Online platforms are particularly sensitive environments for such practices and they present a higher societal risk. Consequently, providers of online platforms should not present advertisements based on profiling as defined in Article 4, point (4), of Regulation (EU) 2016/679, using special categories of personal data referred to in Article 9(1) of that Regulation, including by using profiling categories based on those special categories. This prohibition is without prejudice to the obligations applicable to providers of online platforms or any other service provider or advertiser involved in the dissemination of the advertisements under Union law on protection of personal data.", "st": [{"k": "true", "s": "Providers of online platforms should not present advertisements based on profiling that uses special categories of personal data.", "w": "This is the prohibition in the fourth sentence."}, {"k": "false", "s": "The passage treats online platforms as a lower-risk environment for targeted advertising.", "w": "Online platforms \"present a higher societal risk\"."}, {"k": "cannot", "s": "Targeted advertising is the main source of revenue for online platforms.", "w": "The passage says nothing about platform revenue."}, {"k": "false", "s": "The prohibition described releases advertisers from their obligations under Union data protection law.", "w": "\"This prohibition is without prejudice to the obligations applicable to… any… advertiser… under Union law on protection of personal data.\""}, {"k": "true", "s": "According to the passage, manipulative techniques can contribute to disinformation campaigns.", "w": "The second sentence gives this example."}]}, {"id": "k11", "src": "32022L2555-r52", "topic": "Directive (EU) 2022/2555 (NIS 2 Directive)", "url": "https://eur-lex.europa.eu/eli/dir/2022/2555/oj", "recital": 52, "text": "Open-source cybersecurity tools and applications can contribute to a higher degree of openness and can have a positive impact on the efficiency of industrial innovation. Open standards facilitate interoperability between security tools, benefitting the security of industrial stakeholders. Open-source cybersecurity tools and applications can leverage the wider developer community, enabling diversification of suppliers. Open source can lead to a more transparent verification process of cybersecurity related tools and a community-driven process of discovering vulnerabilities. Member States should therefore be able to promote the use of open-source software and open standards by pursuing policies relating to the use of open data and open-source as part of security through transparency. Policies promoting the introduction and sustainable use of open-source cybersecurity tools are of particular importance for small and medium-sized enterprises facing significant costs for implementation, which could be minimised by reducing the need for specific applications or tools.", "st": [{"k": "true", "s": "The passage suggests that open source can support community-driven discovery of vulnerabilities.", "w": "Open source can lead to \"a community-driven process of discovering vulnerabilities\"."}, {"k": "false", "s": "The passage requires Member States to use only open-source cybersecurity tools.", "w": "Member States \"should… be able to promote\" their use; nothing is required."}, {"k": "cannot", "s": "Open-source cybersecurity tools are cheaper to maintain than proprietary tools.", "w": "The passage does not compare maintenance costs."}, {"k": "true", "s": "According to the passage, policies promoting open-source cybersecurity tools are of particular importance for small and medium-sized enterprises.", "w": "The last sentence says so."}, {"k": "cannot", "s": "Most cybersecurity incidents in the Union affect small and medium-sized enterprises.", "w": "The passage says nothing about incidents."}]}, {"id": "k12", "src": "32019L0882-r70", "topic": "Directive (EU) 2019/882 (European Accessibility Act)", "url": "https://eur-lex.europa.eu/eli/dir/2019/882/oj", "recital": 70, "text": "Microenterprises are distinguished from all other undertakings by their limited human resources, annual turnover or annual balance sheet. The burden of complying with the accessibility requirements for microenterprises therefore, in general, takes a greater share of their financial and human resources than for other undertakings and is more likely to represent a disproportionate share of the costs. A significant proportion of cost for microenterprises comes from completing or keeping paperwork and records to demonstrate compliance with the different requirements set out in Union law. While all economic operators covered by this Directive should be able to assess the proportionality of complying with the accessibility requirements of this Directive and should only comply with them to the extent they are not disproportionate, demanding such an assessment from microenterprises providing services would in itself constitute a disproportionate burden. The requirements and obligations of this Directive should therefore not apply to microenterprises providing services within the scope of this Directive.", "st": [{"k": "true", "s": "The Directive's requirements should not apply to microenterprises providing services within its scope.", "w": "This is the conclusion in the last sentence."}, {"k": "false", "s": "According to the passage, meeting the accessibility requirements costs microenterprises less, relative to their resources, than other undertakings.", "w": "It takes \"a greater share of their financial and human resources\"."}, {"k": "cannot", "s": "The exemption also covers microenterprises that manufacture products.", "w": "The passage speaks only of microenterprises providing services; it is silent on products."}, {"k": "true", "s": "Paperwork to demonstrate compliance accounts for a significant proportion of microenterprises' costs.", "w": "The third sentence says so."}, {"k": "false", "s": "According to the passage, all economic operators covered by the Directive must meet the accessibility requirements in full, whatever the burden.", "w": "They comply \"only… to the extent they are not disproportionate\"."}]}, {"id": "k13", "src": "32023R1781-r1", "topic": "Regulation (EU) 2023/1781 (Chips Act)", "url": "https://eur-lex.europa.eu/eli/reg/2023/1781/oj", "recital": 1, "text": "Semiconductors are at the core of any digital device and the Union’s digital transition: from smartphones and cars, through critical applications and infrastructures in health, energy, communications and automation to most other industry sectors. As semiconductors are central to the digital economy, they are powerful enablers for the sustainability and green transition, contributing thus to the objectives of the Commission communication of 11 December 2019 on ‘The European Green Deal’. While semiconductors are essential to the functioning of today’s economy and society as well as defence and security, the Union has witnessed unprecedented disruptions in their supply, the consequences of which are significant. The current disruptions have exposed long-lasting vulnerabilities in this respect, in particular a strong third-country dependency in manufacturing and design of chips. Member States are primarily responsible for maintaining a strong industrial, competitive, sustainable base in the Union promoting innovation across a full range of chips.", "st": [{"k": "true", "s": "The passage states that the Union depends strongly on third countries for the design of chips.", "w": "\"a strong third-country dependency in manufacturing and design of chips\"."}, {"k": "false", "s": "According to the passage, the Union is primarily responsible for maintaining a strong industrial base for chips.", "w": "\"Member States are primarily responsible\"."}, {"k": "cannot", "s": "The supply disruptions were caused mainly by the COVID-19 pandemic.", "w": "The passage does not give the cause of the disruptions."}, {"k": "true", "s": "Semiconductors are presented as contributing to the objectives of the European Green Deal.", "w": "The second sentence says so."}, {"k": "cannot", "s": "Chip production in the Union has fallen over the last decade.", "w": "The passage says nothing about production trends."}]}, {"id": "k14", "src": "32019L1024-r38", "topic": "Directive (EU) 2019/1024 (Open Data Directive)", "url": "https://eur-lex.europa.eu/eli/dir/2019/1024/oj", "recital": 38, "text": "Libraries, including university libraries, museums and archives should be able to charge above marginal costs in order not to hinder their normal running. In the case of such public sector bodies, the total income from supplying and allowing re-use of documents over the appropriate accounting period should not exceed the cost of collection, production, reproduction, dissemination, preservation and rights clearance, together with a reasonable return on investment. Where applicable, the costs of anonymisation of personal data or of commercially sensitive information should also be included in the eligible cost. For the purpose of libraries, including university libraries, museums and archives, and bearing in mind their particularities, the prices charged by the private sector for the re-use of identical or similar documents could be considered when calculating a reasonable return on investment.", "st": [{"k": "true", "s": "Museums should be able to charge above marginal costs for the re-use of documents.", "w": "The first sentence says so."}, {"k": "false", "s": "Libraries' total income from re-use may exceed their costs plus a reasonable return on investment if their normal running requires it.", "w": "Total income \"should not exceed\" costs plus a reasonable return; normal running justifies only going above marginal cost."}, {"k": "true", "s": "The costs of anonymising personal data can be included in the eligible costs.", "w": "Third sentence: \"Where applicable, the costs of anonymisation… should also be included\"."}, {"k": "cannot", "s": "Private-sector prices for re-using similar documents are usually higher than those of archives.", "w": "The passage does not compare price levels."}, {"k": "false", "s": "When calculating a reasonable return on investment, libraries are required to follow private-sector prices.", "w": "Private-sector prices \"could be considered\"; it is not a requirement."}]}];

// ---------- shared helpers ----------
const R = {
  int:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},
  sample:(a,n)=>R.shuffle(a).slice(0,n),
  chance:p=>Math.random()<p
};
const nf=(x,dp=0)=>Number(x).toLocaleString('en-GB',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LETTERS='ABCDE';

// ---------- VERBAL ----------
const Q_CORRECT='Which of the following statements is correct?';
const Q_INCORRECT='Which of the following statements is incorrect?';

// All verbal passages as "sources". Each source can produce an item.
function verbalSources(){
  const out=[];
  VERBAL_ORIGINAL.forEach(p=>out.push({pid:p.id,origin:'orig',p}));
  VERBAL_KVIZ.forEach(p=>out.push({pid:p.id,origin:'kviz',p}));
  return out;
}

function buildVerbalItem(src){
  if(src.origin==='orig'){
    const p=src.p;
    const opts=p.o.map((o,i)=>({kind:o[0],trap:o[1],text:o[2],why:o[3],key:i===0}));
    return finishVerbal(p.id,p.topic,p.text,p.q,opts,null);
  }
  // EUR-Lex passage: build a 4-option item from its true / false / cannot-say statements
  const p=src.p, T=p.st.filter(s=>s.k==='true'), F=p.st.filter(s=>s.k==='false'), C=p.st.filter(s=>s.k==='cannot');
  const canC=T.length>=1&&F.length+C.length>=3, canI=F.length>=1&&T.length+C.length>=3;
  const q=(canC&&canI)?(R.chance(0.8)?'c':'i'):(canC?'c':'i');
  let key,others;
  if(q==='c'){key=R.pick(T);others=R.sample(F.concat(C),3)}
  else{key=R.pick(F);others=R.sample(T.concat(C),3)}
  const mk=(s,isKey)=>({kind:s.k,trap:s.k==='false'?'con':(s.k==='cannot'?'nd':''),text:s.s,why:s.w,key:isKey});
  const opts=[mk(key,true)].concat(others.map(s=>mk(s,false)));
  return finishVerbal(p.id,p.topic,p.text,q,opts,{url:p.url,recital:p.recital,act:p.topic});
}

function finishVerbal(id,topic,text,q,opts,source){
  const sh=R.shuffle(opts);
  const key=sh.findIndex(o=>o.key);
  return {sec:'verbal',id,topic,text,q,options:sh,key,source,
    question:q==='c'?Q_CORRECT:Q_INCORRECT};
}

// trap label for a wrong verbal choice
function verbalTrap(item,choice){
  const o=item.options[choice]; if(!o||o.key) return null;
  if(item.q==='i'){ return o.kind==='true'?'dom':'ndf'; }
  if(o.kind==='cannot') return o.trap&&o.trap!=='nd'?o.trap:'nd';
  return o.trap||'con';
}

const TRAPS={
  con:'Contraddizione con il testo non vista',
  mix:'Dettagli scambiati (numeri, soggetti, periodi)',
  qnt:'Quantificatori e portata (some / most / all / only)',

const COUNTRIES=['Austria','Belgium','Bulgaria','Croatia','Cyprus','Czechia','Denmark','Estonia','Finland','France','Germany','Greece','Hungary','Ireland','Italy','Latvia','Lithuania','Luxembourg','Malta','Netherlands','Poland','Portugal','Romania','Slovakia','Slovenia','Spain','Sweden'];
const fmtPct=(x,dp=1)=>(x>0?'+':'')+nf(x,dp)+'%';

// Build 5 numeric options: key + listed slips + plausible fillers. Sorted ascending like a real paper.
function numOptions(v,slips,fmt,valFilter){
  const seen=new Set(), list=[];
  const add=(x,why)=>{ if(!isFinite(x)) return false; if(valFilter&&!valFilter(x)) return false; const s=fmt(x); if(seen.has(s)) return false; seen.add(s); list.push({v:x,label:s,why}); return true; };
  if(!add(v,null)) return null;
  slips.forEach(([x,why])=>{ if(list.length<5) add(x,why); });
  let guard=0;
  while(list.length<5&&guard++<200){ const k=(0.06+Math.random()*0.28)*(R.chance(.5)?1:-1); add(v*(1+k),'valore vicino'); }
  list.sort((a,b)=>a.v-b.v);
  return {options:list.map(o=>({label:o.label,why:o.why})),key:list.findIndex(o=>o.why===null)};
}
function nameOptions(rows,keyName,trapMap){
  const names=rows.slice().sort();
  return {options:names.map(n=>({label:n,why:n===keyName?null:(trapMap[n]||'altro paese')})),key:names.indexOf(keyName)};
}

function tableHTML(caption,head,rows,note){
  return `<div class="tblwrap"><table class="data"><caption>${esc(caption)}</caption><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>i===0?`<th scope="row">${esc(c)}</th>`:`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>${note?`<p class="src">${esc(note)}</p>`:''}</div>`;
}
const FICT='Dati fittizi a scopo di esercitazione.';

function barChartSVG(title,labels,vals,unit){
  const W=520,H=260,pl=48,pb=40,pt=28,pr=12, max=Math.max(...vals), top=Math.ceil(max/ (max>100?50:10))*(max>100?50:10);
  const iw=W-pl-pr, ih=H-pt-pb, bw=iw/labels.length*0.56;
  let g='';
  for(let i=0;i<=5;i++){const y=pt+ih-ih*i/5, v=top*i/5; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" class="grid"/><text x="${pl-6}" y="${y+4}" text-anchor="end" class="ax">${nf(v,0)}</text>`;}
  labels.forEach((l,i)=>{const x=pl+iw*(i+0.5)/labels.length, h=ih*vals[i]/top, y=pt+ih-h;
    g+=`<rect x="${x-bw/2}" y="${y}" width="${bw}" height="${h}" class="bar"/><text x="${x}" y="${y-5}" text-anchor="middle" class="val">${nf(vals[i],0)}</text><text x="${x}" y="${H-pb+16}" text-anchor="middle" class="ax">${esc(l)}</text>`;});
  return `<figure class="chart"><figcaption>${esc(title)}</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}</svg><p class="src">${FICT}${unit?' Unità: '+esc(unit)+'.':''}</p></figure>`;
}
function pieChartSVG(title,labels,pcts){
  const cx=130,cy=120,r=95; let a0=-Math.PI/2, g='';
  const tones=['p1','p2','p3','p4','p5','p6'];
  labels.forEach((l,i)=>{const a1=a0+2*Math.PI*pcts[i]/100, large=(a1-a0)>Math.PI?1:0;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    g+=`<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" class="${tones[i%6]}"/>`;
    const am=(a0+a1)/2; g+=`<text x="${(cx+(r*0.66)*Math.cos(am)).toFixed(1)}" y="${(cy+(r*0.66)*Math.sin(am)+4).toFixed(1)}" text-anchor="middle" class="pl">${pcts[i]}%</text>`;
    a0=a1;});
  const leg=labels.map((l,i)=>`<rect x="260" y="${30+i*26}" width="14" height="14" class="${tones[i%6]}"/><text x="282" y="${42+i*26}" class="ax">${esc(l)}</text>`).join('');
  return `<figure class="chart"><figcaption>${esc(title)}</figcaption><svg viewBox="0 0 480 240" role="img" aria-label="${esc(title)}">${g}${leg}</svg></figure>`;
}

function series3(lo,hi){ const a=R.int(lo,hi); const g1=1+(R.int(-80,160)/1000), g2=1+(R.int(-80,160)/1000); const b=Math.round(a*g1), c=Math.round(b*g2); return [a,b,c]; }

const NUM_T={
pct:{label:'Variazione percentuale',make(){
  const m=R.pick(METRICS), rows=R.sample(COUNTRIES,5), y0=R.int(2019,2022), Y=[y0,y0+1,y0+2];
  const data=rows.map(()=>series3(m.lo,m.hi)); const r=R.int(0,4), A=data[r][0], B=data[r][2], M=data[r][1];
  const v=(B-A)/A*100; if(Math.abs(v)<1) return NUM_T.pct.make();
  const o=numOptions(v,[[(B-A)/B*100,'base sbagliata (diviso per il valore finale)'],[(M-A)/A*100,'anno sbagliato'],[-v,'segno invertito']],x=>fmtPct(x));
  return {stim:tableHTML(`${m.n} (${m.u})`,['Country',...Y.map(String)],rows.map((c,i)=>[c,...data[i].map(x=>nf(x))]),FICT),
    question:`By approximately what percentage did ${m.n.toLowerCase()} in ${rows[r]} change between ${Y[0]} and ${Y[2]}?`,...o,
    explain:`(${nf(B)} − ${nf(A)}) ÷ ${nf(A)} × 100 = ${fmtPct(v)}. La base è sempre il valore iniziale (${Y[0]}).`};

share:{label:'Quota sul totale',make(){
  const m=R.pick(METRICS), rows=R.sample(COUNTRIES,5), y0=R.int(2019,2022), Y=[y0,y0+1,y0+2];

maxratio:{label:'Rapporto massimo (gruppo)',make(){

fx:{label:'Conversione valutaria',make(){

reverse:{label:'Percentuale inversa',make(){

compound:{label:'Proiezione a tasso costante',make(){
  const m=R.pick(METRICS), rows=R.sample(COUNTRIES,4), a=rows.map(()=>R.int(m.lo,m.hi)), b=a.map(x=>Math.round(x*(1+R.int(40,180)/1000)));
  const r=R.int(0,3), g=b[r]/a[r], v=b[r]*g*g;
  const o=numOptions(v,[[b[r]+2*(b[r]-a[r]),'crescita lineare invece che composta'],[b[r]*(1+2*(g-1)),'tasso raddoppiato invece che composto'],[b[r]*g,'un solo anno di crescita']],x=>nf(Math.round(x)));

    question:`If ${m.n.toLowerCase()} in ${rows[r]} continues to grow at the same annual percentage rate as between 2023 and 2024, approximately what will the value be in 2026?`,...o,
    explain:`Tasso annuo = ${nf(b[r])} ÷ ${nf(a[r])} = ${nf(g,4)}. 2026 = ${nf(b[r])} × ${nf(g,4)}² ≈ ${nf(Math.round(v))}.`};
}},
pp:{label:'Punti percentuali vs %',make(){
  const rows=R.sample(COUNTRIES,5); const y=[2022,2023,2024]; const d=rows.map(()=>{let a=R.int(30,140)/10; return [a,+(a+R.int(-20,25)/10).toFixed(1),+(a+R.int(-25,30)/10).toFixed(1)].map(x=>Math.max(1.5,x))});
  let r=R.int(0,4); if(d[r][2]===d[r][0]) d[r][2]=+(d[r][0]+0.8).toFixed(1);
  const A=d[r][0],B=d[r][2],pp=+(B-A).toFixed(1),rel=(B-A)/A*100;
  const lab=x=>(x>0?'+':'')+nf(x,1)+' percentage points';
  const cand=[[lab(pp),null],[fmtPct(rel),'variazione relativa, non in punti'],[fmtPct(pp),'confusi punti e percentuale'],[lab(-pp),'segno invertito'],[lab(+(d[r][1]-A).toFixed(1)),'anno sbagliato']];
  const seen=new Set(), list=[]; cand.forEach(([l,w])=>{if(!seen.has(l)){seen.add(l);list.push({label:l,why:w})}});
  while(list.length<5){const l=lab(+(pp+R.pick([-0.6,-0.3,0.4,0.7,1.1])).toFixed(1)); if(!seen.has(l)){seen.add(l);list.push({label:l,why:'valore vicino'})}}
  const sh=R.shuffle(list);
  return {stim:tableHTML('Unemployment rate (% of labour force)',['Country',...y.map(String)],rows.map((c,i)=>[c,...d[i].map(x=>nf(x,1))]),FICT),
    question:`How did the unemployment rate in ${rows[r]} change between 2022 and 2024?`,options:sh,key:sh.findIndex(o=>o.why===null),
    explain:`${nf(B,1)}% − ${nf(A,1)}% = ${lab(pp)}. La variazione relativa (${fmtPct(rel)}) è un'altra grandezza: tra due percentuali la differenza si esprime in punti percentuali.`};
}},
pie:{label:'Grafico a torta',make(){
  const cats=R.sample(['Research','Infrastructure','Training','Administration','Digital services','Communication','Evaluation'],5);
  let p=[R.int(14,34),R.int(10,28),R.int(8,22),R.int(6,18)]; const rest=100-p.reduce((a,b)=>a+b,0); if(rest<4) return NUM_T.pie.make(); p.push(rest);
  const total=R.int(24,96)*10; const i=p.indexOf(Math.max(...p)); let j=R.pick([0,1,2,3,4].filter(x=>p[x]<p[i])); if(j===undefined) return NUM_T.pie.make();
  const v=total*(p[i]-p[j])/100;

}},
bar:{label:'Grafico a barre',make(){

  const hi=Math.max(...vals), lo=Math.min(...vals); if(hi===lo) return NUM_T.bar.make();
  const v=(hi-lo)/lo*100;

weighted:{label:'Media ponderata',make(){
  const g=R.pick([['Women','Men'],['Under 35','35 and over'],['Headquarters','Regional offices']]);
  const n=[R.int(12,60)*100,R.int(12,60)*100], p=[R.int(5,45),R.int(5,45)]; if(n[0]===n[1]) n[1]+=700; if(p[0]===p[1]) p[1]+=6;

  return {stim:tableHTML('Staff of a public agency, 2024',['Group','Number of staff','Working part-time (%)'],[[g[0],nf(n[0]),p[0]+'%'],[g[1],nf(n[1]),p[1]+'%']],FICT),

function buildNumericalItem(tpl){
  const t=tpl||R.pick(Object.keys(NUM_T));
  let x=null; for(let g=0;g<20&&!(x&&x.options&&x.key>=0);g++) x=NUM_T[t].make();
  return {sec:'numerical',id:'n-'+t+'-'+Math.random().toString(36).slice(2,8),tpl:t,stim:x.stim,question:x.question,options:x.options,key:x.key,explain:x.explain};
}

const SHAPES=['circle','square','triangle','hexagon','diamond'];

const FILLS=['white','black','grey','hatch'];
const FILL_IT={white:'bianco',black:'nero',grey:'grigio',hatch:'tratteggiato'};
const mod=(a,n)=>((a%n)+n)%n;

const AB_RULES={
  rot:{label:'Rotazione della lancetta',init(){const step=R.pick([45,90,135,-45,-90,-135]);return {step,start:R.pick([0,45,90,135,180,225,270,315])}},
    at(p,k){return mod(p.start+p.step*k,360)}, slip(p,k){const v=this.at(p,k);return R.pick([mod(v+p.step,360),mod(v-p.step,360),mod(-v,360),mod(v+180,360)]).toString()},
    desc(p){return `La lancetta ruota di ${Math.abs(p.step)}° in senso ${p.step>0?'orario':'antiorario'} a ogni passaggio.`}},
  cnt:{label:'Numero di punti',init(){const alt=R.chance(.35); if(alt) return {alt:true,start:R.int(1,3)}; const d=R.pick([1,-1]); return {alt:false,d,start:d>0?R.int(1,2):R.int(6,7)}},
    at(p,k){ if(p.alt){ return p.start+Math.ceil(k/2)*2-Math.floor(k/2); } return p.start+p.d*k },
    slip(p,k){const v=this.at(p,k); const c=[v+1,v-1,this.at(p,k-1)].filter(x=>x>=1&&x<=8&&x!==v); return R.pick(c)},
    desc(p){return p.alt?'I punti seguono lo schema +2, −1, +2, −1…':`I punti ${p.d>0?'aumentano':'diminuiscono'} di uno a ogni passaggio.`}},
  pos:{label:'Posizione del quadratino',init(){return {s:R.pick([1,2,3,-1,-2,-3]),start:R.int(0,7)}},
    at(p,k){return mod(p.start+p.s*k,8)}, slip(p,k){const v=this.at(p,k);return R.pick([mod(v+1,8),mod(v-1,8),this.at(p,k-1),mod(v+p.s,8)].filter(x=>x!==v))},
    desc(p){const a=Math.abs(p.s);return `Il quadratino si sposta di ${a} posizion${a>1?'i':'e'} in senso ${p.s>0?'orario':'antiorario'} lungo il bordo.`}},
  fill:{label:'Riempimento',init(){const per=R.pick([2,3]);return {cyc:R.sample(FILLS,per)}},
    at(p,k){return p.cyc[mod(k,p.cyc.length)]}, slip(p,k){const v=this.at(p,k);return R.pick(FILLS.filter(f=>f!==v))},
    desc(p){return `Il riempimento della figura segue il ciclo ${p.cyc.map(f=>FILL_IT[f]).join(' → ')}.`}},
  shape:{label:'Forma centrale',init(){const per=R.pick([2,3]);return {cyc:R.sample(SHAPES,per)}},
    at(p,k){return p.cyc[mod(k,p.cyc.length)]}, slip(p,k){const v=this.at(p,k);return R.pick(SHAPES.filter(s=>s!==v))},
    desc(p){return `La figura centrale segue il ciclo ${p.cyc.map(s=>SHAPE_IT[s]).join(' → ')}.`}}
};
const ATTR={rot:'rot',cnt:'cnt',pos:'pos',fill:'fill',shape:'shape'};

function buildAbstractItem(hard){
  const n=hard?3:2;
  let names=R.sample(['rot','cnt','pos','fill','shape'],n);
  const P={}; names.forEach(r=>P[r]=AB_RULES[r].init());
  // constant attributes for the rest
  const base={shape:R.pick(SHAPES),fill:R.pick(FILLS),rot:null,cnt:null,pos:null};
  // elements not in rules: sometimes shown as constants (noise)
  if(!P.rot&&R.chance(.4)) base.rot=R.pick([0,90,180,270]);
  if(!P.cnt&&R.chance(.4)) base.cnt=R.int(1,5);
  if(!P.pos&&R.chance(.3)) base.pos=R.int(0,7);
  const frame=k=>{const f=Object.assign({},base); names.forEach(r=>{f[r]=AB_RULES[r].at(P[r],k)}); return f};
  const series=[0,1,2,3,4].map(frame), ans=frame(5);
  const sig=f=>JSON.stringify([f.shape,f.fill,f.rot,f.cnt,f.pos]);
  const opts=[{f:ans,broken:[]}], seen=new Set([sig(ans)]);
  let guard=0;
  while(opts.length<5&&guard++<300){
    const nb=guard>120?2:1; const br=R.sample(names,Math.min(nb,names.length)); const f=Object.assign({},ans);
    br.forEach(r=>{let v=AB_RULES[r].slip(P[r],5); if(r==='rot'||r==='cnt'||r==='pos') v=Number(v); f[r]=v});
    const s=sig(f); if(seen.has(s)) continue; seen.add(s); opts.push({f,broken:br});
  }
  const sh=R.shuffle(opts);
  return {sec:'abstract',id:'a-'+Math.random().toString(36).slice(2,8),rules:names,hard:!!hard,series,options:sh.map(o=>({frame:o.f,broken:o.broken})),key:sh.findIndex(o=>o.broken.length===0),
    explain:names.map(r=>AB_RULES[r].desc(P[r])).join(' ')};
}

const MARK=[[3,3],[46.5,3],[90,3],[90,46.5],[90,90],[46.5,90],[3,90],[3,46.5]];
function frameSVG(f,label){
  const cx=50,cy=44, fill=f.fill==='white'?'#ffffff':f.fill==='black'?'#111111':f.fill==='grey'?'#9aa0a6':'url(#hatch)';
  let s='';
  const st=`fill="${fill}" stroke="#111" stroke-width="2.2"`;
  if(f.shape==='circle') s+=`<circle cx="${cx}" cy="${cy}" r="20" ${st}/>`;
  if(f.shape==='square') s+=`<rect x="${cx-18}" y="${cy-18}" width="36" height="36" ${st}/>`;
  if(f.shape==='triangle') s+=`<polygon points="${cx},${cy-22} ${cx+21},${cy+15} ${cx-21},${cy+15}" ${st}/>`;
  if(f.shape==='diamond') s+=`<polygon points="${cx},${cy-22} ${cx+20},${cy} ${cx},${cy+22} ${cx-20},${cy}" ${st}/>`;
  if(f.shape==='hexagon'){const pts=[0,1,2,3,4,5].map(i=>{const a=Math.PI/3*i;return (cx+20*Math.cos(a)).toFixed(1)+','+(cy+20*Math.sin(a)).toFixed(1)}).join(' ');s+=`<polygon points="${pts}" ${st}/>`;}
  if(f.rot!==null&&f.rot!==undefined){const a=(f.rot-90)*Math.PI/180, x=cx+27*Math.cos(a), y=cy+27*Math.sin(a);
    s+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#fff" stroke-width="6" stroke-linecap="round"/><line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#111" stroke-width="2.6" stroke-linecap="round"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6" fill="#111" stroke="#fff" stroke-width="1.2"/>`;}
  if(f.cnt){const n=f.cnt, w=(n-1)*9; for(let i=0;i<n;i++) s+=`<circle cx="${(50-w/2+i*9).toFixed(1)}" cy="78" r="3.2" fill="#111"/>`;}
  if(f.pos!==null&&f.pos!==undefined){const [x,y]=MARK[f.pos]; s+=`<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/>`;}
  return `<svg class="fig" viewBox="0 0 100 100" role="img" aria-label="${esc(label||'figura')}"><rect x="0.5" y="0.5" width="99" height="99" fill="#fff" stroke="#8a929c"/>${s}</svg>`;
}

// ---------- session building ----------
function pickVerbal(n,onlyWrong){
  let srcs=verbalSources();
  if(onlyWrong){ srcs=srcs.filter(s=>DB.vwrong[s.pid]); if(!srcs.length) return null; }
  srcs=R.shuffle(srcs).sort((a,b)=>(DB.seen[a.pid]||0)-(DB.seen[b.pid]||0));
  return srcs.slice(0,Math.min(n,srcs.length)).map(buildVerbalItem);
}
function pickNumerical(n){
  const keys=R.shuffle(Object.keys(NUM_T)); const out=[];
  for(let i=0;i<n;i++){ let it=null,g=0; while(!it&&g++<5){ try{ it=buildNumericalItem(keys[i%keys.length]); if(!it.options) it=null; }catch(e){ it=null } } out.push(it||buildNumericalItem('pct')); }
  return R.shuffle(out);
}
function pickAbstract(n){ const out=[]; for(let i=0;i<n;i++) out.push(buildAbstractItem(i>=Math.round(n*0.4))); return out; }
function buildSection(sec,n,onlyWrong){
  if(sec==='verbal') return pickVerbal(n,onlyWrong);
  if(sec==='numerical') return pickNumerical(n);
  return pickAbstract(n);
}

let S=null, TIMER=null;

function startSession(kind,opts){
  // kind: 'full' | 'single' | 'practice' | 'review'
  const secs = kind==='full' ? ['verbal','numerical','abstract'] : [opts.sec];
  const parts=[];
  for(const sec of secs){
    const n = opts.n || SEC[sec].n;
    const items=buildSection(sec,n,kind==='review');
    if(!items||!items.length){ renderHome('Nessuna domanda verbale sbagliata da ripassare per ora.'); return; }
    parts.push({sec,items,ans:{},flag:{},ms:{},changes:{},cur:0,timed:kind!=='practice'&&kind!=='review',seconds:Math.round(SEC[sec].sec*items.length/SEC[sec].n),started:null,ended:null,deadline:null});
  }
  S={kind,parts,pi:0,created:Date.now(),done:false};
  renderIntro();
}

function beginPart(){
  CALC.open=false;
  const P=S.parts[S.pi]; P.started=Date.now(); P.last=Date.now(); if(P.timed) P.deadline=Date.now()+P.seconds*1000;
  clearInterval(TIMER); TIMER=setInterval(tick,250); renderTest();
}
function account(){ const P=S&&S.parts[S.pi]; if(!P||!P.started||P.ended) return; const now=Date.now(), it=P.items[P.cur]; P.ms[P.cur]=(P.ms[P.cur]||0)+(now-P.last); P.last=now; }
function tick(){
  const P=S&&S.parts[S.pi]; if(!P||!P.started||P.ended) return; account();
  const el=$('#clock'); if(!el) return;
  if(P.timed){ const left=(P.deadline-Date.now())/1000; el.textContent=fmtT(left); el.classList.toggle('low',left<=Math.min(300,P.seconds*0.15));
    const pc=$('#pace'); if(pc){ const per=P.seconds/P.items.length, ideal=Math.min(P.items.length,Math.floor((P.seconds-left)/per)); const done=Object.keys(P.ans).length; pc.textContent=`${done}/${P.items.length} risposte · ritmo ${done>=ideal?'in linea':'in ritardo'} · obiettivo ${fmtT(per)} a domanda`; }
    if(left<=0) endPart(true);
  } else el.textContent=fmtT((Date.now()-P.started)/1000);
}
function go(i){ const P=S.parts[S.pi]; if(i<0||i>=P.items.length) return; account(); P.cur=i; renderTest(); }
function choose(c){ const P=S.parts[S.pi]; if(!P.timed&&P.ans[P.cur]!==undefined) return; const prev=P.ans[P.cur]; if(prev!==undefined&&prev!==c) P.changes[P.cur]=(P.changes[P.cur]||0)+1; P.ans[P.cur]=c; renderTest(); }
function endPart(auto){
  const P=S.parts[S.pi]; if(P.ended) return; account(); P.ended=Date.now(); P.auto=!!auto; clearInterval(TIMER);
  if(S.pi<S.parts.length-1){ S.pi++; renderIntro(); } else finishSession();
}

function scorePart(P){ return P.items.reduce((s,it,i)=>s+(P.ans[i]===it.key?1:0),0); }
function tagOf(P,i){
  const it=P.items[i], a=P.ans[i];
  if(it.sec==='verbal') return a===undefined?'blank':(a===it.key?'ok':verbalTrap(it,a));
  if(it.sec==='numerical') return it.tpl;
  return it.rules.join('+');
}
function finishSession(){
  S.done=true; clearInterval(TIMER);
  const rec={id:Date.now(),date:S.created,kind:S.kind,parts:[]};
  S.parts.forEach(P=>{
    const att=P.items.map((it,i)=>{
      const a=P.ans[i], ok=a===it.key;
      const r={sec:it.sec,id:it.id,ok,ans:a===undefined?null:a,key:it.key,ms:Math.round(P.ms[i]||0),ch:P.changes[i]||0,fl:!!P.flag[i]};
      if(it.sec==='verbal'){ r.q=it.q; r.trap=ok||a===undefined?null:verbalTrap(it,a); r.kind=a===undefined?null:it.options[a].kind;
        DB.seen[it.id]=(DB.seen[it.id]||0)+1; if(ok) delete DB.vwrong[it.id]; else DB.vwrong[it.id]=1; }
      if(it.sec==='numerical'){ r.tpl=it.tpl; r.slip=ok||a===undefined?null:(it.options[a].why||''); }
      if(it.sec==='abstract'){ r.rules=it.rules; r.broken=ok||a===undefined?null:it.options[a].broken; r.hard=it.hard; }
      return r;});
    rec.parts.push({sec:P.sec,n:P.items.length,score:scorePart(P),secs:Math.round((P.ended-P.started)/1000),limit:P.timed?P.seconds:null,auto:!!P.auto,att});
  });
  DB.sessions.unshift(rec); DB.sessions=DB.sessions.slice(0,300); saveDB();
  S.rec=rec; renderResults(); window.scrollTo(0,0);
}

// ---------- verdict per notice ----------
function verdict(rec){
  const g=s=>rec.parts.find(p=>p.sec===s);
  const v=g('verbal'), n=g('numerical'), a=g('abstract'); const out=[];
  if(v&&v.n===20) out.push({label:'Verbale',score:`${v.score}/20`,pass:v.score>=PASS.verbal,rule:'soglia 10/20'});
  if(n&&a&&n.n===10&&a.n===10) out.push({label:'Numerico + astratto',score:`${n.score+a.score}/20`,pass:n.score+a.score>=PASS.numabs,rule:'soglia combinata 10/20'});
  return out;
}

// ---------- on-screen calculator ----------
const CALC={open:false,expr:'',out:'0'};
function toggleCalc(keep){
  const el=$('#calc'); if(!el) return; if(!keep) CALC.open=!CALC.open; el.hidden=!CALC.open; if(!CALC.open) return;
  const keys=['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','%','+','C','⌫','(',')','='];
  el.innerHTML=`<div class="row spread"><span class="eyebrow">Calcolatrice</span><button class="ghost small" id="calc-x">Chiudi</button></div><div class="cdisp mono"><div class="cexpr">${esc(CALC.expr||' ')}</div><div class="cout">${esc(CALC.out)}</div></div><div class="ckeys">${keys.map(k=>`<button data-k="${k}" class="${k==='='?'primary':''}">${k}</button>`).join('')}</div>`;
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>calcKey(b.dataset.k)); $('#calc-x').onclick=()=>toggleCalc();
}
function calcKey(k){
  if(k==='C'){CALC.expr='';CALC.out='0'} else if(k==='⌫'){CALC.expr=CALC.expr.slice(0,-1)} else if(k==='='){CALC.out=calcEval(CALC.expr)} else CALC.expr+=k;
  toggleCalc(true);
}
function calcEval(e){
  const s=e.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
  if(!/^[0-9+\-*/().\s]*$/.test(s)||!s.trim()) return 'Errore';
  try{ const v=Function('"use strict";return ('+s+')')(); return isFinite(v)?String(+v.toPrecision(12)):'Errore'; }catch(x){ return 'Errore'; }
}

const CAUSES={letto:'Testo letto male',tempo:'Tempo',form:'Formulazione',calcolo:'Calcolo'};
function partResult(p,P,pi){
  const c=SEC[p.sec], budget=SEC[p.sec].sec/SEC[p.sec].n;
  let analysis='';
  if(p.sec==='verbal'){
    const cnt={}; p.att.forEach(a=>{if(a.trap)cnt[a.trap]=(cnt[a.trap]||0)+1});
    const kinds={cannot:0,false:0,true:0}; p.att.forEach(a=>{if(!a.ok&&a.kind)kinds[a.kind]++});
    analysis=`<div class="stack"><h3>Dove hai sbagliato</h3>${Object.keys(cnt).length?`<ul class="bars">${Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<li><span>${esc(TRAPS[k]||k)}</span><b class="mono">${n}</b></li>`).join('')}</ul>`:'<p class="muted">Nessun errore classificato.</p>'}
      <p class="small muted">Opzioni sbagliate scelte: ${kinds.cannot} non deducibili, ${kinds.false} false${kinds.true?', '+kinds.true+' vere (nelle domande "incorrect")':''}.</p></div>`;
  } else if(p.sec==='numerical'){
    const by={}; p.att.forEach(a=>{const k=a.tpl;by[k]=by[k]||{n:0,ok:0};by[k].n++;if(a.ok)by[k].ok++});
    const slips={}; p.att.forEach(a=>{if(a.slip)slips[a.slip]=(slips[a.slip]||0)+1});
    analysis=`<div class="stack"><h3>Per tipo di calcolo</h3><ul class="bars">${Object.entries(by).map(([k,o])=>`<li><span>${esc(NUM_T[k].label)}</span><b class="mono">${o.ok}/${o.n}</b></li>`).join('')}</ul>${Object.keys(slips).length?`<p class="small muted">Errori tipici: ${Object.entries(slips).map(([k,n])=>esc(k)+(n>1?' ×'+n:'')).join(' · ')}.</p>`:''}</div>`;
  } else {
    const br={}; p.att.forEach(a=>{(a.broken||[]).forEach(r=>br[r]=(br[r]||0)+1)});
    const hard=p.att.filter(a=>a.hard), easy=p.att.filter(a=>!a.hard);
    analysis=`<div class="stack"><h3>Regole mancate</h3>${Object.keys(br).length?`<ul class="bars">${Object.entries(br).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<li><span>${esc(AB_RULES[k].label)}</span><b class="mono">${n}</b></li>`).join('')}</ul>`:'<p class="muted">Nessuna regola mancata.</p>'}<p class="small muted">Serie con 2 regole: ${easy.filter(a=>a.ok).length}/${easy.length} · con 3 regole: ${hard.filter(a=>a.ok).length}/${hard.length}.</p></div>`;
  }
  const maxms=Math.max(...p.att.map(a=>a.ms),1);
  return `<section class="panel stack">
    <div class="row spread"><h2>${c.it}</h2><span class="mono big2">${p.score}/${p.n}</span></div>
    <p class="muted">Tempo usato ${fmtT(p.secs)}${p.limit?' su '+fmtT(p.limit):''}${p.auto?' · consegna automatica allo scadere':''} · ${p.att.filter(a=>a.ans===null).length} senza risposta · budget ${fmtT(budget)} a domanda</p>
    <div class="grid2">${analysis}
      <div class="stack"><h3>Tempo per domanda</h3><div class="tblwrap"><table class="times"><thead><tr><th>#</th><th>Esito</th><th>Tempo</th><th></th></tr></thead><tbody>${p.att.map((a,i)=>`<tr><td class="mono">${i+1}</td><td>${a.ans===null?'<span class="muted">vuota</span>':a.ok?'<span class="okc">✓</span>':'<span class="badc">✗</span>'}${a.fl?' ⚑':''}</td><td class="mono">${fmtT(a.ms/1000)}</td><td class="tb"><i class="${a.ms/1000>budget?'over':''}" style="width:${Math.round(a.ms/maxms*100)}%"></i></td></tr>`).join('')}</tbody></table></div></div>
    </div>
    <details ${p.score<p.n?'open':''}><summary>Rivedi le ${p.n} domande con le soluzioni. Per ogni errore indica la causa.</summary><div class="review">${P.items.map((it,i)=>reviewItem(it,P.ans[i],i,pi,p.att[i])).join('')}</div></details>
  </section>`;
}
function reviewItem(it,a,i,pi,att){
  const ok=a===it.key;
  const causeBtns=(!ok&&att)?`<div class="row causes"><span class="small muted">Causa dell'errore:</span>${Object.entries(CAUSES).map(([k,l])=>`<button class="small ${att.cause===k?'csel':''}" data-cause="${pi}:${i}:${k}">${l}</button>`).join('')}</div>`:'';
  let body='';
  if(it.sec==='verbal') body=`<details class="inner"><summary>Brano</summary><p class="passage small2">${esc(it.text)}</p></details><p class="small muted">${esc(it.question)}</p>${it.options.map((o,j)=>`<p class="${j===it.key?'okc':(j===a?'badc':'')}"><span class="mono">${LETTERS[j]}</span> ${esc(o.text)}<br><span class="small muted">${{true:'Vera',false:'Falsa',cannot:'Non deducibile'}[o.kind]}: ${esc(o.why)}</span></p>`).join('')}`;
  else if(it.sec==='numerical') body=`<details class="inner"><summary>Dati</summary>${it.stim}</details><p>${esc(it.question)}</p><p class="small">${it.options.map((o,j)=>`<span class="${j===it.key?'okc':(j===a?'badc':'')}">${LETTERS[j]}. ${esc(o.label)}</span>`).join(' · ')}</p><p class="small muted">${esc(it.explain)}</p>`;
  else body=`<div class="series sm">${it.series.map(f=>frameSVG(f)).join('')}<div class="qmark">?</div></div><div class="series sm">${it.options.map((o,j)=>`<div class="optmini ${j===it.key?'k':''} ${j===a&&!ok?'w':''}"><span class="mono">${LETTERS[j]}</span>${frameSVG(o.frame)}</div>`).join('')}</div><p class="small muted">${esc(it.explain)}</p>`;
  return `<div class="ritem ${ok?'ok':'bad'}"><div class="row"><span class="mono">${String(i+1).padStart(2,'0')}</span><span>${a===undefined?'Senza risposta':ok?'Corretta':'Tua: '+LETTERS[a]+' · giusta: '+LETTERS[it.key]}</span></div>${body}${causeBtns}</div>`;
}

      <div class="panel stack"><h2>Trappole verbali più frequenti</h2>${Object.keys(traps).length?`<ul class="bars">${Object.entries(traps).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<li><span>${esc(TRAPS[k]||k)}</span><b class="mono">${n}</b></li>`).join('')}</ul>`:'<p class="muted">Ancora nessun errore verbale.</p>'}</div>
      <div class="panel stack"><h2>Numerico per tipo di calcolo</h2>${Object.keys(tpl).length?`<div class="tblwrap"><table class="times"><thead><tr><th>Tipo</th><th>Corrette</th><th>Tempo medio</th></tr></thead><tbody>${Object.entries(tpl).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).map(([k,o])=>`<tr><td>${esc(NUM_T[k]?NUM_T[k].label:k)}</td><td class="mono">${o.ok}/${o.n}</td><td class="mono">${fmtT(o.ms/o.n/1000)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Ancora nessuna risposta.</p>'}</div>
      <div class="panel stack"><h2>Astratto per regola</h2>${Object.keys(rules).length?`<div class="tblwrap"><table class="times"><thead><tr><th>Regola</th><th>Presente</th><th>Mancata</th></tr></thead><tbody>${Object.entries(rules).map(([k,o])=>`<tr><td>${esc(AB_RULES[k].label)}</td><td class="mono">${o.n}</td><td class="mono">${o.miss}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Ancora nessuna risposta.</p>'}</div>
      <div class="panel stack"><h2>Fogli risposte (libro)</h2>${sheets.length?`<div class="tblwrap"><table class="times"><thead><tr><th>Data</th><th>Etichetta</th><th>Punteggio</th><th>Tempo</th></tr></thead><tbody>${sheets.map(s=>`<tr><td>${fmtD(s.date)}</td><td>${esc(s.label||'')}</td><td class="mono">${s.parts[0].score}/${s.parts[0].n}</td><td class="mono">${fmtT(s.parts[0].secs)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Nessun foglio risposte salvato.</p>'}</div>
    </section>
    <section class="panel stack"><h2>Esporta e backup</h2>
      <p class="muted small">CSV: una riga per domanda, da aprire in Excel o Google Sheets. Backup JSON: per spostare lo storico su un altro computer o browser.</p>
      ${exportBlock(sessionCSV(ss),'tutto')}
      <div class="row"><button id="bk">Scarica backup JSON</button><label class="filebtn">Importa backup<input type="file" id="imp" accept="application/json"></label><button id="reset" class="ghost">Cancella tutto lo storico</button></div>
    </section>
    ${footer()}
  </main>`;
  bindNav(); bindExport();
  $('#bk').onclick=()=>download('epso-reasoning-backup.json',JSON.stringify(DB),'application/json');
  $('#imp').onchange=e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{try{const d=JSON.parse(r.result); if(!d.sessions) throw 0; DB=d; saveDB(); toast('Backup importato.'); renderStats();}catch(x){toast('File non valido: serve un backup esportato da questo programma.')}}; r.readAsText(f);};
  let armed=false; $('#reset').onclick=()=>{ if(!armed){armed=true;$('#reset').textContent='Conferma: cancella tutto';return} DB={sessions:[],seen:{},vwrong:{},plan:{}}; saveDB(); renderStats(); toast('Storico cancellato.'); };
}

function sessionCSV(list){
  const rows=[['session_date','mode','section','q','item','correct','answer','key','seconds','answer_changes','flagged','detail','cause']];
  list.forEach(s=>s.parts.forEach(p=>(p.att||[]).forEach((a,i)=>{
    const det=a.sec==='verbal'?(a.trap||''):a.sec==='numerical'?(a.tpl+(a.slip?': '+a.slip:'')):a.sec==='abstract'?((a.rules||[]).join('+')+(a.broken?' missed '+a.broken.join('+'):'')):(s.label||'');
    rows.push([new Date(s.date).toISOString(),s.kind,a.sec,i+1,a.id,a.ok?1:0,a.ans===null?'':LETTERS[a.ans],a.key===null||a.key===undefined?'':LETTERS[a.key],(a.ms/1000).toFixed(1),a.ch||0,a.fl?1:0,det,a.cause?CAUSES[a.cause]:'']);
  })));
  return rows.map(r=>r.map(x=>/[",\n]/.test(String(x))?'"'+String(x).replace(/"/g,'""')+'"':x).join(',')).join('\n');
}
function exportBlock(csv,name){ return `<div class="stack exp" data-name="${name}"><div class="row"><button class="dl">Scarica CSV</button><button class="cp">Copia CSV</button><span class="small muted st"></span></div><textarea readonly class="csv">${esc(csv)}</textarea></div>`; }
function bindExport(){ document.querySelectorAll('.exp').forEach(b=>{const t=b.querySelector('textarea'), st=b.querySelector('.st');
  b.querySelector('.dl').onclick=()=>download('epso-reasoning-'+b.dataset.name+'.csv',t.value,'text/csv');
  b.querySelector('.cp').onclick=()=>{const fb=()=>{t.focus();t.select();st.textContent='Testo selezionato: copia con Ctrl/Cmd+C.'}; try{navigator.clipboard.writeText(t.value).then(()=>st.textContent='Copiato.',fb)}catch(e){fb()}};});}
function download(name,text,type){ try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Download avviato. Se non parte, usa "Copia".')}catch(e){toast('Download non disponibile qui: usa "Copia".')} }

// ---------- answer sheet for book practice ----------
let SH=null;
function renderSheetSetup(){
  app().innerHTML=header('Foglio risposte','Per i test su carta o su libro: cronometro, risposte, correzione e statistiche. Il programma non contiene le domande.')+`
  <main class="wrap stack narrow"><div class="panel stack">
    <label>Tipo di prova<select id="sh-type"><option value="verbal">Verbale · 20 dom. · 35:00 · 4 opzioni</option><option value="numerical">Numerico · 10 dom. · 20:00 · 5 opzioni</option><option value="abstract">Astratto · 10 dom. · 10:00 · 5 opzioni</option><option value="custom">Personalizzato</option></select></label>
    <div class="row wrap-gap"><label>Domande<input id="sh-n" type="number" min="1" max="120" value="20"></label><label>Minuti<input id="sh-m" type="number" min="1" max="240" value="35"></label><label>Opzioni<select id="sh-o"><option>4</option><option>5</option></select></label></div>
    <label>Etichetta (es. "Libro AD 2015, test verbale 1, dom. 1-20")<input id="sh-l" type="text" maxlength="80"></label>
    <div class="row"><button class="primary" id="sh-go">Avvia cronometro</button></div>
  </div>${footer()}</main>`;
  bindNav();
  const set=()=>{const t=$('#sh-type').value; if(t!=='custom'){ $('#sh-n').value=SEC[t].n; $('#sh-m').value=SEC[t].sec/60; $('#sh-o').value=SEC[t].letters; }};
  $('#sh-type').onchange=set;
  $('#sh-go').onclick=()=>{ const n=Math.max(1,Math.min(120,+$('#sh-n').value||20)), m=Math.max(1,+$('#sh-m').value||35), o=+$('#sh-o').value;
    SH={type:$('#sh-type').value,n,sec:m*60,o,label:$('#sh-l').value.trim(),ans:{},key:{},t:{},start:Date.now(),last:Date.now(),phase:'run'}; clearInterval(TIMER); TIMER=setInterval(sheetTick,250); renderSheet(); };
}
function sheetTick(){ if(!SH||SH.phase!=='run') return; const left=SH.sec-(Date.now()-SH.start)/1000; const el=$('#clock'); if(el){el.textContent=fmtT(left); el.classList.toggle('low',left<=Math.min(300,SH.sec*0.15));} if(left<=0){ sheetStop(); } }
function sheetStop(){ SH.phase='key'; SH.end=Date.now(); clearInterval(TIMER); renderSheet(); }
function renderSheet(){
  const L=LETTERS.slice(0,SH.o).split('');
  const run=SH.phase==='run';
  app().innerHTML=`<div class="bar"><div class="in"><div class="row"><span class="secname">Foglio risposte</span><span class="clock mono" id="clock">${run?'--:--':fmtT((SH.end-SH.start)/1000)}</span><span class="small muted">${esc(SH.label)}</span></div><div class="row"><button class="ghost" data-nav="home">Inizio</button><button class="ghost" data-nav="stats">Statistiche</button>${run?'<button class="primary" id="sh-stop">Ferma e correggi</button>':'<button class="primary" id="sh-score">Calcola punteggio</button>'}</div></div></div>
  <main class="wrap stack narrow"><div class="panel stack">
    <p class="muted small">${run?'Segna la risposta di ogni domanda. Il tempo di ogni domanda è misurato dalla risposta precedente.':'Ora inserisci la soluzione dal libro (colonna "Chiave"). Il punteggio si aggiorna quando premi "Calcola punteggio".'}</p>
    <div class="tblwrap"><table class="sheet"><thead><tr><th>#</th><th>Tua risposta</th>${run?'':'<th>Chiave</th>'}<th>Tempo</th></tr></thead><tbody>
    ${Array.from({length:SH.n},(_,i)=>`<tr><td class="mono">${i+1}</td><td><div class="seg">${L.map(l=>`<button class="${SH.ans[i]===l?'sel':''}" data-a="${i}:${l}" ${run?'':'disabled'}>${l}</button>`).join('')}</div></td>${run?'':`<td><div class="seg">${L.map(l=>`<button class="${SH.key[i]===l?'selk':''}" data-k="${i}:${l}">${l}</button>`).join('')}</div></td>`}<td class="mono">${SH.t[i]?fmtT(SH.t[i]/1000):'–'}</td></tr>`).join('')}
    </tbody></table></div>
    <div id="sh-res"></div>
  </div>${footer()}</main>`;
  sheetTick(); bindNav();
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const [i,l]=b.dataset.a.split(':'); const now=Date.now(); if(SH.ans[i]===undefined){SH.t[i]=now-SH.last; SH.last=now;} SH.ans[i]=l; renderSheet();});
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const [i,l]=b.dataset.k.split(':'); SH.key[i]=l; renderSheet();});
  if($('#sh-stop')) $('#sh-stop').onclick=sheetStop;
  if($('#sh-score')) $('#sh-score').onclick=()=>{
    const keyed=Object.keys(SH.key).length; if(keyed<SH.n){ $('#sh-res').innerHTML=`<p class="alert">Mancano ${SH.n-keyed} chiavi.</p>`; return; }
    const att=Array.from({length:SH.n},(_,i)=>({sec:'sheet',id:'q'+(i+1),ok:SH.ans[i]===SH.key[i],ans:SH.ans[i]?LETTERS.indexOf(SH.ans[i]):null,key:LETTERS.indexOf(SH.key[i]),ms:SH.t[i]||0,ch:0,fl:false}));
    const score=att.filter(a=>a.ok).length;
    const rec={id:Date.now(),date:SH.start,kind:'sheet',label:SH.label||(SEC[SH.type]?SEC[SH.type].it:'Personalizzato'),parts:[{sec:SH.type,n:SH.n,score,secs:Math.round((SH.end-SH.start)/1000),limit:SH.sec,att}]};
    DB.sessions.unshift(rec); saveDB();
    const pass=SH.type==='verbal'&&SH.n===20?`<span class="pill ${score>=10?'ok':'bad'}">${score>=10?'Sopra':'Sotto'} la soglia 10/20</span>`:'';
    $('#sh-res').innerHTML=`<div class="row"><b class="mono big2">${score}/${SH.n}</b>${pass}<span class="muted">Salvato nelle statistiche.</span></div>`+exportBlock(sessionCSV([rec]),'foglio');
    bindExport(); SH.phase='done';
  };
}

function footer(){ return `<footer class="foot">
  <p>Formato e soglie dal bando EPSO/AD/427/26: verbale 20 domande in 35 minuti (soglia 10/20); numerico 10 in 20 minuti e astratto 10 in 10 minuti (soglia combinata 10/20). Numerico e astratto sono generati al momento con dati fittizi. Il punteggio qui non predice il risultato reale.</p>
  <p>Verbale: 30 brani originali scritti per questo programma; 14 brani da atti UE con affermazioni adattate da <a href="https://github.com/Chartres/epso-kviz" target="_blank" rel="noopener">EPSO AI Field Trainer</a> (CC BY-NC-SA 4.0). Testi UE © European Union, <a href="https://eur-lex.europa.eu" target="_blank" rel="noopener">EUR-Lex</a>, riuso ai sensi della Decisione 2011/833/UE. Uso personale, non commerciale. Progetto indipendente, non affiliato a EPSO.</p>
</footer>`; }

document.addEventListener('keydown',e=>{
  if(!S||S.done||e.metaKey||e.ctrlKey||e.altKey) return; const P=S.parts[S.pi]; if(!P||!P.started||P.ended) return;
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  const n=P.items[P.cur].options.length, k=e.key.toLowerCase();
  let idx='abcde'.indexOf(k); if(idx<0) idx='12345'.indexOf(k);
  if(idx>=0&&idx<n){ choose(idx); e.preventDefault(); return; }
  if(e.key==='ArrowRight') go(P.cur+1); else if(e.key==='ArrowLeft') go(P.cur-1);
  else if(k==='f'&&P.timed){P.flag[P.cur]=!P.flag[P.cur];renderTest();}
});
window.addEventListener('beforeunload',e=>{ if(S&&!S.done&&S.parts[S.pi]&&S.parts[S.pi].started){ e.preventDefault(); e.returnValue=''; } });

renderHome();


</script>
