# Esempio: paper su large language model da OpenAlex, dal 2018.
# Variabili d'ambiente:
#   OPENALEX_API_KEY  (obbligatoria per l'uso reale; gratuita con un account OpenAlex)
#   OPENALEX_MAILTO   (consigliata: email di contatto)

storage:
  database: data/papers.sqlite   # relativo alla cartella da cui lanci il comando
  store_raw: true                # salva anche il JSON grezzo (più spazio, ma rielaborabile)

http:                            # default per tutte le fonti; ogni fonte può sovrascriverli
  user_agent: "data-collector/0.1 (mailto:${OPENALEX_MAILTO:-not-set})"
  requests_per_second: 5         # OpenAlex consente fino a 100 req/s: restiamo prudenti
  timeout: 30
  max_retries: 5
  backoff_base: 1.0
  backoff_max: 60
  respect_robots: true

sources:
  - name: openalex_llm
    connector: openalex
    base_url: https://api.openalex.org
    endpoint: /works
    params:
      api_key: ${OPENALEX_API_KEY:-}
      mailto: ${OPENALEX_MAILTO:-}
      # Filtri base (AND). Il filtro incrementale viene aggiunto in automatico.
      filter: "title_and_abstract.search:large language model,type:article"
      per-page: 100
      # Solo i campi che servono (risposte più leggere). Niente spazi dopo le virgole.
      select: "id,doi,display_name,publication_date,publication_year,language,type,cited_by_count,counts_by_year,abstract_inverted_index,authorships,primary_location,primary_topic,topics,keywords,open_access,updated_date"

    # Tetto di sicurezza: con la key gratuita (~1 $/giorno) e le query di search
    # (~1 $ ogni 1.000 chiamate), 900 richieste da 100 record ≈ 90.000 paper/giorno.
    max_requests_per_run: 900

    id_field: "id | strip_prefix:https://openalex.org/"
    dedup_key: doi

    incremental:
      field: published_date
      # from_updated_date richiede un piano premium; con premium usa
      # "from_updated_date:{since}" e field: source_updated_at
      filter: "from_publication_date:{since}"
      start: "2018-01-01"
      lookback_days: 30

    fields:
      doi: "doi | strip_prefix:https://doi.org/ | lower"
      title: display_name
      abstract: "abstract_inverted_index | inverted_index_text"
      published_date: publication_date
      year: publication_year
      language: language
      type: type
      venue: primary_location.source.display_name
      authors: authorships[].author.display_name
      author_ids: "authorships[].author.id | strip_prefix:https://openalex.org/"
      institutions: "authorships[].institutions[].display_name | flatten | unique"
      countries: "authorships[].institutions[].country_code | flatten | unique"
      primary_topic: primary_topic.display_name
      subfield: primary_topic.subfield.display_name
      field: primary_topic.field.display_name
      domain: primary_topic.domain.display_name
      topics: topics[].display_name
      keywords: keywords[].display_name
      cited_by_count: cited_by_count
      citations_by_year: counts_by_year
      is_oa: open_access.is_oa
      oa_url: open_access.oa_url
      landing_page_url: primary_location.landing_page_url
      pdf_url: primary_location.pdf_url
      source_updated_at: updated_date
