[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-collector"
version = "0.1.0"
description = "Collector di dati generico e configurabile (API → SQLite/Parquet)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
collector = "collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
